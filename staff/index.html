<style>
/* Layout: one-thumb phone app; content column + fixed bottom tab bar; the current job always fills the top */
:root {
  --paper: #f7eedf; --card: #fffaf1; --ink: #3c2219; --ink-2: #7b6352; --olive: #6c7454; --olive-ink: #fffaf1;
  --sand: #ead6b6; --line: #e2d1b6; --mute: #b9a993; --ok: #5e7a45; --warn: #a3542f; --hero: #3c2219; --hero-ink: #f7eedf;
  --f-display: 'Gilda Display', Georgia, serif; --f-body: 'Anuphan', 'Noto Sans Thai', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1d1612; --card: #29201a; --ink: #f2e4cf; --ink-2: #bba58c; --olive: #a7b287; --olive-ink: #1d1612;
  --sand: #4a3a2a; --line: #3b2f25; --mute: #6c5d4d; --ok: #9cbf7c; --warn: #e39a72; --hero: #322620; --hero-ink: #f2e4cf; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1d1612; --card: #29201a; --ink: #f2e4cf; --ink-2: #bba58c; --olive: #a7b287; --olive-ink: #1d1612;
  --sand: #4a3a2a; --line: #3b2f25; --mute: #6c5d4d; --ok: #9cbf7c; --warn: #e39a72; --hero: #322620; --hero-ink: #f2e4cf; color-scheme: dark }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--olive); outline-offset: 2px; }
.wrap { max-width: 480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 96px; display: grid; gap: 14px; }
h1, h2, h3 { margin: 0; font-weight: 600; }
.demo { background: var(--sand); border-radius: 14px; padding: 10px 12px; display: grid; gap: 8px; font-size: 13px; }
.demo .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.demo b { font-variant-numeric: tabular-nums; }
.lchat { background: #8cabd9; border-radius: 18px; padding: 10px; display: grid; gap: 8px; font-size: 13.5px; }
.lchat .h { display: flex; justify-content: space-between; gap: 8px; color: #10213f; font-weight: 700; font-size: 12.5px; flex-wrap: wrap; }
.lchat .m { background: #fff; color: #222; border-radius: 4px 16px 16px 16px; padding: 10px 12px; max-width: 88%; display: grid; gap: 4px; box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.lchat .m small { color: #6b7a45; font-weight: 700; font-size: 11.5px; }
.lchat .m.warn small { color: #b5651d; }
.lchat .m p { margin: 0; white-space: pre-line; }
.lchat .m button { background: #3c2219; color: #fff; border: 0; border-radius: 8px; padding: 8px; font-weight: 700; font-size: 13px; }
.lchat .t { color: #10213f; font-size: 11px; opacity: .8; }
.btn { background: var(--ink); color: var(--paper); border: 0; border-radius: 14px; padding: 13px 18px; font-weight: 700; font-size: 16px; }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.olive { background: var(--olive); color: var(--olive-ink); }
.btn.small { padding: 7px 12px; font-size: 13px; border-radius: 10px; font-weight: 600; }
.btn:disabled { opacity: .4; }
.hint { color: var(--ink-2); font-size: 13px; margin: 0; }
.err { color: var(--warn); font-size: 14px; margin: 0; font-weight: 600; }

.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.top .who b { font-size: 18px; display: block; }
.top .who span { font-size: 12.5px; color: var(--ink-2); }
.shift { border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; border: 1px solid var(--line); background: var(--card); white-space: nowrap; }
.shift.on { background: var(--olive); color: var(--olive-ink); border-color: var(--olive); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 10px; }
.hero { background: var(--hero); color: var(--hero-ink); border-radius: 22px; padding: 18px; display: grid; gap: 12px; }
.hero .eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; opacity: .75; }
.hero .q { font-family: var(--f-display); font-size: 40px; line-height: 1; }
.hero .big { font-family: var(--f-display); font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.hero .btn { background: var(--hero-ink); color: var(--hero); }
.hero .btn.ghost { background: transparent; color: var(--hero-ink); border-color: rgb(255 255 255 / .3); }
.hero .btn.olive { background: var(--olive); color: var(--olive-ink); }
.hero .hint { color: var(--hero-ink); opacity: .75; }
.bar { height: 10px; border-radius: 999px; background: rgb(255 255 255 / .18); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--sand); }
.seats { display: grid; gap: 4px; font-size: 13px; }
.seats div { display: flex; justify-content: space-between; gap: 8px; opacity: .85; font-variant-numeric: tabular-nums; }
.seats div.now { opacity: 1; font-weight: 700; }

.job { display: grid; gap: 8px; }
.job .head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.job .head b { font-size: 17px; }
.job .head span { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.prefs { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { border-radius: 999px; padding: 3px 10px; font-size: 12.5px; background: var(--sand); color: var(--ink); }
.tag.strong { background: var(--warn); color: var(--paper); }
.tag.olive { background: var(--olive); color: var(--olive-ink); }
.note { border-left: 3px solid var(--warn); padding: 4px 10px; font-size: 13.5px; }
.hero .tag { background: rgb(255 255 255 / .14); color: var(--hero-ink); }
.hero .tag.strong { background: var(--warn); color: #fff; }

.board { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.seat { border: 1px solid var(--line); border-radius: 14px; padding: 10px; background: var(--card); display: grid; gap: 2px; }
.seat b { font-size: 14px; }
.seat span { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.seat.busy { border-color: var(--olive); box-shadow: inset 4px 0 0 var(--olive); }
.payrow { display: grid; gap: 4px; border-bottom: 1px dashed var(--line); padding-bottom: 10px; }
.payrow:last-child { border-bottom: 0; padding-bottom: 0; }
.kv { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; }
.kv span:first-child { color: var(--ink-2); }
.kv.total { font-weight: 700; font-size: 15px; }
.kv.total span:first-child { color: var(--ink); }
.total-big { font-family: var(--f-display); font-size: 48px; line-height: 1; font-variant-numeric: tabular-nums; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); z-index: 5; }
.tabs button { background: none; border: 0; padding: 12px 0 14px; font-weight: 600; color: var(--ink-2); position: relative; }
.tabs button[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 3px 0 var(--olive); }
.tabs .badge { position: absolute; top: 6px; margin-left: 4px; background: var(--warn); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 6px; }

.login { max-width: 360px; margin: 0 auto; display: grid; gap: 14px; padding-top: 24px; }
.login h1 { font-family: var(--f-display); font-weight: 400; font-size: 36px; }
.disp { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; text-align: center; font-size: 26px; letter-spacing: .08em; min-height: 62px; font-variant-numeric: tabular-nums; }
.keys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.key { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 0; font-size: 22px; font-weight: 700; }
.key.ok { background: var(--olive); color: var(--olive-ink); border-color: var(--olive); font-size: 17px; }

.sheet { position: fixed; inset: 0; background: rgb(20 12 8 / .5); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet .panel { background: var(--paper); width: 100%; max-width: 480px; border-radius: 22px 22px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; max-height: 90vh; overflow-y: auto; }
.choices { display: grid; gap: 8px; }
.choice { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 13px; text-align: left; font-weight: 600; }
.choice small { display: block; font-weight: 400; color: var(--ink-2); }
video { width: 100%; border-radius: 14px; background: #000; max-height: 50vh; }
.alert { position: fixed; left: 12px; right: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); background: var(--warn); color: #fff; border-radius: 16px; padding: 14px 16px; font-weight: 700; z-index: 30; box-shadow: 0 10px 30px rgb(0 0 0 / .25); max-width: 456px; margin: 0 auto; }
.toast { position: fixed; left: 12px; right: 12px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); border-radius: 14px; padding: 11px 14px; font-size: 14px; z-index: 30; max-width: 456px; margin: 0 auto; }
@media (prefers-reduced-motion: no-preference) { .alert { animation: pop .25s ease-out; } @keyframes pop { from { transform: translateY(-12px); opacity: 0; } } }
</style>
</head>

/* distance in metres between two GPS points */
function lnDistance(lat1, lng1, lat2, lng2) {
  var R = 6371000, r = Math.PI / 180, dLat = (lat2 - lat1) * r, dLng = (lng2 - lng1) * r;
  var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return Math.round(2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}
function lnFind(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
function lnHM(m) { var h = Math.floor(m / 60), x = m % 60; return (h < 10 ? '0' : '') + h + ':' + (x < 10 ? '0' : '') + x; }
function lnPairs(str) { return String(str || '').split(',').filter(Boolean).map(function (p) { var kv = p.split(':'); return { k: kv[0].trim(), v: parseFloat(kv[1]) || 0 }; }); }
function lnNormPhone(raw, intl) {
  var str = String(raw || '').trim(), d = str.replace(/\D/g, '');
  if (!d) return '';
  if (intl || (str.charAt(0) === '+' && d.indexOf('66') !== 0)) return '+' + d;
  if (d.indexOf('66') === 0 && d.length >= 11) d = d.slice(2);
  if (d.charAt(0) === '0') d = d.slice(1);
  return '+66' + d;
}
function lnCanDo(staff, progId) { var s = String(staff.skills || 'ALL').toUpperCase(); return s === 'ALL' || s.split(',').map(function (x) { return x.trim(); }).indexOf(progId) >= 0; }

/* seats one person's visit needs, in order, with hair / style / add-on minutes added */
function lnChain(prog, person) {
  var segs = lnPairs(prog.segs).map(function (p) { return { res: p.k, min: p.v }; });
  var hair = lnFind(LANA.HAIR, person.hair) || LANA.HAIR[0], style = lnFind(LANA.STYLES, person.style) || LANA.STYLES[0];
  if (String(prog.hair).toUpperCase() === 'TRUE') segs.forEach(function (s) { if (s.res === 'dry') s.min += hair.min + style.min; });
  (person.addons || []).forEach(function (id) {
    var a = lnFind(LANA.ADDONS, id); if (!a || !a.min) return;
    var target = a.seat === 'first' ? segs[0] : segs.filter(function (s) { return s.res === a.seat; })[0];
    if (target) target.min += a.min;
  });
  return segs;
}
function lnChainMin(segs) { return segs.reduce(function (s, x) { return s + x.min; }, 0); }

function lnUnitFree(rows, br, date, res, unit, a, b) {

    if (r.branch === br && r.date === date && r.res === res && r.unit === unit && a < r.end + LANA.BUFFER && r.start < b + LANA.BUFFER) return false; }
  return true;
}
/* booked or live seats of every visit except one */
function lnOccupied(bookings, exceptId) {

    if (bk.id === exceptId || ['noshow', 'cancelled'].indexOf(bk.status) >= 0) return;
    if (bk.live && bk.live.length) {
      bk.live.forEach(function (r) { var e = bk.finishedAt != null && bk.finishedAt !== '' ? Math.min(r.end, +bk.finishedAt) : r.end; if (e > r.start) rows.push({ branch: bk.branch, date: bk.date, res: r.res, unit: r.unit, start: r.start, end: e, bid: bk.id }); });
    } else bk.people.forEach(function (p) { (p.alloc || []).forEach(function (a) { rows.push({ branch: bk.branch, date: bk.date, res: a.res, unit: a.unit, start: a.start, end: a.end, bid: bk.id }); }); });
  });
  return rows;
}
function lnAllocate(branch, date, start, chains, rows) {
  if (start < LANA.OPEN || start + Math.max.apply(null, chains.map(lnChainMin)) > LANA.CLOSE) return null;
  var used = rows.slice(), out = [];

      if (!found) return null;
      var row = { branch: branch.id, date: date, res: s.res, unit: found, start: m, end: m + s.min };

}
/* actual seats once a visit starts. Seats already in use never change; later seats may move to a free unit. */
function lnBuildLive(bk, branch, others, nowMin) {
  var placed = [], rows = others.slice();
  for (var pi = 0; pi < bk.people.length; pi++) {

      var units = [prev ? prev.unit : seg.unit], started = prev && prev.start <= nowMin;

      for (var k = 0; k < units.length; k++) if (lnUnitFree(rows, bk.branch, bk.date, seg.res, units[k], m, m + len)) { got = units[k]; break; }
      if (!got) return { ok: false, res: seg.res, start: m, end: m + len };
      if (m + len > LANA.CLOSE) return { ok: false, res: 'close', start: m, end: m + len };
      var row = { branch: bk.branch, date: bk.date, res: seg.res, unit: got, start: m, end: m + len, pi: pi, i: i };

/* try a change; if a not-yet-started visit is in the way, move it to another free seat at the same time */

/* ===== LANA STAFF API (same code runs in Apps Script and in the demo) =====

            log(staffId, bookingId, action, detail), lock(fn) }

function staffApi(req, store, now) {
  var a = req.action;
  if (a === 'login') return apiLogin(req, store);
  if (a === 'lineLogin') return apiLineLogin(req, store);
  var sid = store.session(req.token);
  if (!sid) throw new Error('LOGIN');
  var me = lnFind(store.staff(), sid);
  if (!me || String(me.active).toUpperCase() !== 'TRUE') throw new Error('LOGIN');
  if (a === 'feed') return apiFeed(me, store, now);
  if (a === 'clock') return store.lock(function () { return apiClock(me, req, store, now); });
  if (a === 'accept') return store.lock(function () { return apiAccept(me, req, store, now); });
  if (a === 'start') return store.lock(function () { return apiStart(me, req, store, now); });
  if (a === 'extend') return store.lock(function () { return apiExtend(me, req, store, now); });
  if (a === 'finish') return store.lock(function () { return apiFinish(me, req, store, now); });
  if (a === 'move') return store.lock(function () { return apiMove(me, req, store, now); });
  if (a === 'pay') return apiPayReport(me, store, now);
  if (a === 'unlink') return store.lock(function () { me.lineUserId = ''; store.saveStaff(me); store.log(me.id, '', 'line_unlink', ''); return { ok: true }; });

function apiLogin(req, store) {

  if (!s || String(s.pin) !== String(req.pin)) throw new Error('BAD_LOGIN');
  /* first time inside LINE: phone + PIN links this LINE account to the staff row, later opens skip the PIN */
  if (req.idToken) {
    var uid = store.lineUser(req.idToken);
    store.lock(function () {
      store.staff().forEach(function (x) { if (x.lineUserId === uid && x.id !== s.id) { x.lineUserId = ''; store.saveStaff(x); } });
      s.lineUserId = uid; store.saveStaff(s); store.log(s.id, '', 'line_link', '');
    });
  }
  return { token: store.newSession(s.id), staff: apiStaffPublic(s), linked: !!req.idToken };
}
function apiLineLogin(req, store) {
  var uid = store.lineUser(req.idToken);
  var s = store.staff().filter(function (x) { return x.lineUserId && x.lineUserId === uid && String(x.active).toUpperCase() === 'TRUE'; })[0];

}

    if (br && br.lat !== '' && br.lat != null && br.lng !== '' && br.lng != null) {
      if (req.lat == null || req.lng == null || req.lat === '' || req.lng === '') throw new Error('NEED_GPS');

    }

    if (b.id === 'd-plus5') { DNOW.min += 5; return loadFeed(true); }
    if (b.id === 'd-walk') {
      var br = S.feed ? S.feed.me.branch : 'NIM', progs = br === 'MCH' ? ['SPA45', 'SPA90'] : ['SPA45', 'THAI120', 'FOOT90', 'NECK60', 'COMBO120'], names = ['Sophie', 'คุณบอส', 'Kenji', 'คุณแพร', 'Anna'];
      var v = makeVisit(DS, DNOW, br, progs[Math.floor(Math.random() * progs.length)], names[Math.floor(Math.random() * names.length)], { hair: ['short', 'blade', 'mid'][Math.floor(Math.random() * 3)], pressure: ['light', 'medium', 'firm'][Math.floor(Math.random() * 3)], focus: [] });
      if (!v) toast('วันนี้ไม่มีที่ว่างแล้ว'); return loadFeed(true);
    }
  });
  $('alert').onclick = function () { $('alert').hidden = true; S.tab = 'work'; render(); };
  $('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) closeSheet(); });

  /* ---------- start ---------- */
  render();
  if (inLine) lineStart(); else if (S.token) loadFeed();
  if (!demo) setInterval(function () { if (S.token && document.visibilityState === 'visible') loadFeed(true); }, 10000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && S.token && !demo) loadFeed(true); });
})();
</script>
