<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e5757">
<title>ระบบคลินิก Dr.tan · Jungbin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
[hidden]{display:none!important}
/* ===== สีตามแบรนด์ — ค่าเริ่มต้น = Dr.tan (เขียวหัวเป็ดเข้ม ตามโลโก้) · data-brand="jungbin" = ม่วงลาเวนเดอร์-ชมพู ===== */
:root{
  --bg:#f3f6f5;--surface:#ffffff;--surface2:#eaf0ef;--line:#dbe5e3;--ink:#14201f;--ink2:#4f6260;--ink3:#869794;
  --accent:#0e5757;--accent-ink:#ffffff;--accent-soft:#dcecea;--accent-grad:linear-gradient(120deg,#11605f,#0d3d3d);--accent2:#b0884f;
  --warn:#a86b12;--warn-soft:#fbf0dc;--bad:#b23a3a;--bad-soft:#f8e1df;--good:#2f7d4f;--good-soft:#e0f0e5;--info:#2c5d8f;--info-soft:#e1ebf6;
  --shadow:0 1px 2px rgba(10,40,40,.05),0 4px 14px rgba(10,40,40,.06);--r:14px;
  --c1:#0e5757;--c2:#c08a4a;--c3:#5b6bb8;--c4:#a8487a;
}
:root[data-brand="jungbin"]{
  --bg:#faf7fb;--surface:#ffffff;--surface2:#f3edf5;--line:#e9dfee;--ink:#2a2330;--ink2:#6a5f72;--ink3:#9a8fa2;
  --accent:#8b64a0;--accent-ink:#ffffff;--accent-soft:#f1e6f5;--accent-grad:linear-gradient(115deg,#a97cb8,#7f5a96);--accent2:#c2709d;
  --shadow:0 1px 2px rgba(60,30,70,.05),0 4px 14px rgba(60,30,70,.07);
  --c1:#8b64a0;--c2:#d08bb0;--c3:#6f86c6;--c4:#c9a24f;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1514;--surface:#172020;--surface2:#1f2a29;--line:#2c3a38;--ink:#e5eeec;--ink2:#a7b8b5;--ink3:#74868a;
    --accent:#6cc5ba;--accent-ink:#062320;--accent-soft:#173734;--accent-grad:linear-gradient(120deg,#7fd3c8,#4fa79d);--accent2:#e0b26f;
    --warn:#e3b05c;--warn-soft:#3a2f1a;--bad:#ec8079;--bad-soft:#3d2120;--good:#6fc790;--good-soft:#1b3424;--info:#86b4e6;--info-soft:#1b2c3f;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);--c1:#6cc5ba;--c2:#e0b26f;--c3:#97a6f0;--c4:#e08bb8;color-scheme:dark}
  :root[data-brand="jungbin"]:not([data-theme="light"]){
    --bg:#151118;--surface:#1e1823;--surface2:#28202e;--line:#3a3042;--ink:#efe8f2;--ink2:#bcaec4;--ink3:#8d8096;
    --accent:#d2acdf;--accent-ink:#2a1a33;--accent-soft:#352840;--accent-grad:linear-gradient(115deg,#e3c1ea,#c49ad4);--accent2:#e8a6c8;
    --c1:#d2acdf;--c2:#e8a6c8;--c3:#9fb2ec;--c4:#e2c47f}
}
:root[data-theme="dark"]{
  --bg:#0f1514;--surface:#172020;--surface2:#1f2a29;--line:#2c3a38;--ink:#e5eeec;--ink2:#a7b8b5;--ink3:#74868a;
  --accent:#6cc5ba;--accent-ink:#062320;--accent-soft:#173734;--accent-grad:linear-gradient(120deg,#7fd3c8,#4fa79d);--accent2:#e0b26f;
  --warn:#e3b05c;--warn-soft:#3a2f1a;--bad:#ec8079;--bad-soft:#3d2120;--good:#6fc790;--good-soft:#1b3424;--info:#86b4e6;--info-soft:#1b2c3f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);--c1:#6cc5ba;--c2:#e0b26f;--c3:#97a6f0;--c4:#e08bb8;color-scheme:dark}
:root[data-brand="jungbin"][data-theme="dark"]{
  --bg:#151118;--surface:#1e1823;--surface2:#28202e;--line:#3a3042;--ink:#efe8f2;--ink2:#bcaec4;--ink3:#8d8096;
  --accent:#d2acdf;--accent-ink:#2a1a33;--accent-soft:#352840;--accent-grad:linear-gradient(115deg,#e3c1ea,#c49ad4);--accent2:#e8a6c8;
  --c1:#d2acdf;--c2:#e8a6c8;--c3:#9fb2ec;--c4:#e2c47f}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;margin:0;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.hd{font-family:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:1.6rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:.6rem .75rem;width:100%;min-height:46px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label{display:flex;flex-direction:column;gap:.25rem;font-size:.85rem;color:var(--ink2);min-width:0}
label.ck{flex-direction:row;align-items:flex-start;gap:.6rem;font-size:.95rem;color:var(--ink);cursor:pointer}
label.ck input{width:22px;min-height:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:none}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 90px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.top .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:.6rem;padding-block:.55rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .ttl{flex:1;min-width:0;font-family:"Bai Jamjuree",sans-serif;font-weight:600;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who{font-size:.8rem;color:var(--ink2);text-align:right;line-height:1.25}
.brand-dot{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-family:"Bai Jamjuree";flex:none;font-size:.85rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:.6rem 1rem;min-height:46px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.p{background:var(--accent-grad);border-color:transparent;color:var(--accent-ink)}
.btn.w{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.btn.d{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.g{background:var(--good-soft);border-color:transparent;color:var(--good)}
.btn.q{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.sm{min-height:36px;padding:.3rem .7rem;font-size:.88rem;border-radius:10px}
.btn.lg{min-height:58px;font-size:1.08rem;padding:.8rem 1.4rem}
.btn.blk{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1rem;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.stack{display:flex;flex-direction:column;gap:.75rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.sp{flex:1}
.grid{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.g2{display:grid;gap:.75rem;grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{display:grid;gap:.75rem;grid-template-columns:repeat(3,minmax(0,1fr))}
.split{display:grid;gap:1rem;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);align-items:start}
@media (max-width:820px){.split{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.g2,.g3{grid-template-columns:1fr}h1{font-size:1.35rem}}
.muted{color:var(--ink2)}.small{font-size:.85rem}.xs{font-size:.76rem}.b{font-weight:600}.r{text-align:right}.mono{font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;font-family:"Bai Jamjuree",sans-serif;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:.3rem;border-radius:99px;padding:.12rem .6rem;font-size:.78rem;font-weight:500;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.pill.a{background:var(--accent-soft);color:var(--accent)}.pill.w{background:var(--warn-soft);color:var(--warn)}.pill.d{background:var(--bad-soft);color:var(--bad)}.pill.g{background:var(--good-soft);color:var(--good)}.pill.i{background:var(--info-soft);color:var(--info)}
.allergy{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:.4rem .7rem;font-weight:600}
.tile{display:flex;flex-direction:column;gap:.35rem;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.1rem;min-height:120px;cursor:pointer;box-shadow:var(--shadow);position:relative}
.tile .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tile .ic svg{width:24px;height:24px}
.tile b{font-family:"Bai Jamjuree";font-size:1.08rem}
.tile .badge{position:absolute;top:.8rem;right:.8rem;background:var(--accent2);color:var(--surface);border-radius:99px;min-width:28px;height:28px;display:grid;place-items:center;font-weight:700;font-size:.9rem;padding:0 .5rem}
.tile.hero{background:var(--accent-grad);color:var(--accent-ink);border-color:transparent}
.tile.hero .ic{background:color-mix(in srgb,var(--accent-ink) 12%,transparent);color:var(--accent-ink)}
.tile.hero .muted{color:inherit;opacity:.85}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:.75rem;align-items:center;padding:.75rem .2rem;border-bottom:1px solid var(--line);min-width:0;cursor:default}
.li:last-child{border-bottom:0}
.li.tap{cursor:pointer}.li.tap:hover{background:var(--surface2)}
.li .main{flex:1;min-width:0}
.li .t{font-weight:600}
.li .s{font-size:.85rem;color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
.qn{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:"Bai Jamjuree";font-weight:700;font-size:1.15rem;flex:none}
.tabs{display:flex;gap:.35rem;overflow-x:auto;padding-bottom:.2rem;scrollbar-width:none}
.tabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:.45rem .95rem;cursor:pointer;white-space:nowrap;min-height:40px}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prod{display:grid;gap:.55rem;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.prod button{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:.7rem .75rem;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:.2rem;min-height:86px}
.prod button:active{border-color:var(--accent)}
.prod button .pr{margin-top:auto;font-family:"Bai Jamjuree";font-weight:600;color:var(--accent)}
.prod button.promo{background:var(--warn-soft);border-color:transparent}
.cart .li{align-items:flex-start}
.qty{display:flex;align-items:center;gap:.2rem}
.qty button{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer}
.qty span{min-width:26px;text-align:center}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-family:"Bai Jamjuree";font-size:1.5rem;font-weight:700}
.kpi{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.kpi .card{padding:.85rem 1rem}
.kpi .v{font-family:"Bai Jamjuree";font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .l{font-size:.8rem;color:var(--ink2)}
.up{color:var(--good)}.dn{color:var(--bad)}
.tbl{overflow-x:auto;border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:.5rem .55rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:600;color:var(--ink2);font-size:.8rem;background:var(--surface2);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;max-width:330px;margin:0 auto}
.pin button{height:68px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font-size:1.5rem;font-family:"Bai Jamjuree";cursor:pointer}
.dots{display:flex;gap:.7rem;justify-content:center;margin:1rem 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink3)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.sig{border:1.5px dashed var(--ink3);border-radius:12px;background:#fff;touch-action:none;width:100%;height:170px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chips button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:.5rem .85rem;cursor:pointer;min-height:44px;text-align:left}
.chips button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.chips button.busy{opacity:.5}
.board{display:grid;gap:.8rem;grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.board{grid-template-columns:1fr}}
.col{background:var(--surface2);border-radius:16px;padding:.6rem;display:flex;flex-direction:column;gap:.55rem;min-height:140px;min-width:0}
.col h3{font-size:.95rem;padding:.2rem .3rem;display:flex;justify-content:space-between}
.qc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.7rem;cursor:pointer;display:flex;flex-direction:column;gap:.25rem;min-width:0}
.qc.due{border:2px solid var(--bad);background:var(--bad-soft)}
.qc .nm{font-weight:600;display:flex;gap:.4rem;align-items:center}
.timer{font-family:"Bai Jamjuree";font-weight:700;font-variant-numeric:tabular-nums}
.sched{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);max-height:72vh}
.sched .gridt{display:grid;position:relative}
.sched .hdr{position:sticky;top:0;z-index:3;background:var(--surface2);font-size:.78rem;font-weight:600;padding:.45rem .4rem;border-bottom:1px solid var(--line);border-left:1px solid var(--line);text-align:center;line-height:1.2}
.sched .tm{position:sticky;left:0;z-index:2;background:var(--surface);font-size:.72rem;color:var(--ink3);padding-right:.35rem;text-align:right;border-top:1px solid var(--line)}
.sched .cell{border-top:1px solid var(--line);border-left:1px solid var(--line)}
.sched .cell.hr{border-top-color:var(--ink3)}
.sched .ap{position:absolute;border-radius:9px;padding:.25rem .4rem;font-size:.74rem;line-height:1.25;overflow:hidden;cursor:pointer;background:var(--accent-soft);color:var(--ink);border-left:4px solid var(--accent);z-index:1}
.sched .ap.c{background:var(--info-soft);border-left-color:var(--info)}
.sched .ap.ARRIVED{background:var(--good-soft);border-left-color:var(--good)}
.sched .ap.NOSHOW{background:var(--surface2);border-left-color:var(--ink3);opacity:.7;text-decoration:line-through}
.sched .ap.ipd{background:var(--warn-soft);border-left-color:var(--warn)}
.sched .now{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:2}
.slots{display:grid;gap:.45rem;grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.slots button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:.45rem;cursor:pointer;text-align:center;line-height:1.25}
.slots button.on{border-color:var(--accent);background:var(--accent-soft)}
.slots button b{font-family:"Bai Jamjuree";font-size:1.05rem}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block}
.bar{display:flex;align-items:center;gap:.5rem;font-size:.86rem}
.bar .tr{flex:1;height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;min-width:40px}
.bar .tr i{display:block;height:100%;background:var(--accent);border-radius:99px}
.sec{display:flex;align-items:center;gap:.6rem;margin:.4rem 0 .1rem}
.sec h2{flex:1}
.note{background:var(--info-soft);color:var(--info);border-radius:12px;padding:.7rem .9rem;font-size:.9rem}
.note.w{background:var(--warn-soft);color:var(--warn)}
.empty{text-align:center;color:var(--ink3);padding:1.6rem .5rem;font-size:.92rem}
.photo{display:grid;gap:.5rem;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.photo figure{margin:0;position:relative}
.photo img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;max-width:100%}
.photo figcaption{font-size:.72rem;color:var(--ink2)}
.idimg{max-width:100%;border-radius:12px;border:1px solid var(--line)}
.receipt{font-variant-numeric:tabular-nums}
.receipt .li{padding:.4rem 0}
/* overlay/dialog */
#busy{position:fixed;inset:0;z-index:90;background:rgba(10,20,18,.32);display:grid;place-items:center;backdrop-filter:blur(1.5px)}
#busy .box{background:var(--surface);border-radius:18px;padding:1.2rem 1.6rem;display:flex;align-items:center;gap:.9rem;box-shadow:var(--shadow);font-weight:600}
.spin{width:30px;height:30px;border-radius:50%;border:3.5px solid var(--accent-soft);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
.spin.sm{width:18px;height:18px;border-width:2.5px}
@keyframes sp{to{transform:rotate(360deg)}}
#dlg{position:fixed;inset:0;z-index:80;background:rgba(10,20,18,.42);display:flex;align-items:flex-end;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@media (min-width:640px){#dlg{align-items:center}}
#dlg .box{background:var(--bg);border-radius:20px;width:min(640px,100%);max-height:92vh;overflow:auto;padding:1.1rem;display:flex;flex-direction:column;gap:.8rem;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#dlg .box.wide{width:min(900px,100%)}
#dlg .acts{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:-1.1rem;background:var(--bg);padding-block:.6rem;margin-bottom:-.6rem}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:95;display:flex;flex-direction:column;gap:.4rem;align-items:center;width:min(560px,calc(100% - 32px))}
#toast div{background:var(--ink);color:var(--bg);border-radius:12px;padding:.65rem 1rem;font-size:.95rem;box-shadow:var(--shadow);animation:tin .2s}
#toast div.e{background:var(--bad);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.demo-banner{background:var(--warn-soft);color:var(--warn);font-size:.8rem;text-align:center;padding:.3rem 1rem}
.login-hero{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center;gap:1.2rem;max-width:760px;margin:0 auto}
.brcards{display:grid;gap:.75rem;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:520px){.brcards{grid-template-columns:1fr}}
.brcards button{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:1.1rem;cursor:pointer;display:flex;flex-direction:column;gap:.2rem;min-height:96px;box-shadow:var(--shadow)}
.brcards button b{font-family:"Bai Jamjuree";font-size:1.15rem}
.demo-pins{font-size:.8rem;color:var(--ink2);display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.2rem .8rem}
.demo-pins button{all:unset;cursor:pointer;padding:.15rem 0}
.demo-pins button b{color:var(--accent);font-family:"Bai Jamjuree";margin-right:.35rem}
.hide-sm{}
@media (max-width:620px){.hide-sm{display:none!important}}

/* โลโก้ (mask — ระบายสีตามธีม) */
.logo{display:inline-block;flex:none;background:linear-gradient(160deg,#106262,#0f3f3f 65%,#132626);-webkit-mask:var(--lm) center/contain no-repeat;mask:var(--lm) center/contain no-repeat}
.logo.jb{background:linear-gradient(90deg,#e8c3db,#b993c8)}
.logo.mk{width:34px;height:34px}
.logo.full{width:150px;height:170px}
.logo.jb.full{width:150px;height:150px}
.brcards button{position:relative;overflow:hidden;flex-direction:row;align-items:center;gap:.9rem}
.brcards button .t{display:flex;flex-direction:column;gap:.15rem;min-width:0}
.brcards button.jb{border-color:color-mix(in srgb,#b993c8 35%,var(--line))}
.brcards button.jb:hover,.brcards button.jb:focus-visible{border-color:#b993c8}
.brcards button .logo{width:52px;height:52px}
.brand-pair{display:flex;gap:1.1rem;align-items:center}
.brand-pair .logo.mk{width:46px;height:46px}
.rc-logo{display:flex;justify-content:center}
.rc-logo .logo.full{width:120px;height:136px}.rc-logo .logo.jb.full{width:110px;height:110px}
.mailprev{width:100%;height:70vh;border:1px solid var(--line);border-radius:12px;background:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo.dt{background:linear-gradient(160deg,#8ad8cd,#4fa79d)}}
:root[data-theme="dark"] .logo.dt{background:linear-gradient(160deg,#8ad8cd,#4fa79d)}
.li.cs{flex-wrap:wrap}.li.cs .main{flex:1 1 220px}.li.cs .bx{display:flex;gap:.5rem;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.li.cs .bx{width:100%}}
.vin{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.hx{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.5rem}
.hx-i{border-radius:12px;padding:.55rem .75rem;display:flex;flex-direction:column;gap:.1rem;border:1.5px solid var(--line);background:var(--surface2)}
.hx-i span{font-size:.75rem;color:var(--ink2)}.hx-i b{font-size:1.02rem;line-height:1.3}
.hx-i.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}.hx-i.bad span{color:var(--bad)}
.hx-i.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}.hx-i.warn span{color:var(--warn)}
.hx-i.ok b{color:var(--good)}
.vt{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.vt>div{background:var(--accent-soft);border-radius:12px;padding:.45rem .8rem;display:flex;align-items:baseline;gap:.35rem}
.vt>div span{font-size:.75rem;color:var(--ink2);font-weight:600}.vt>div b{font-family:"Bai Jamjuree",sans-serif;font-size:1.35rem;font-variant-numeric:tabular-nums}.vt>div i{font-style:normal;font-size:.75rem;color:var(--ink3)}
.vt>div.bad{background:var(--bad-soft)}.vt>div.bad b{color:var(--bad)}
.vt p{margin:0;flex-basis:100%}
.note.d{background:var(--bad-soft);color:var(--bad)}
.hx-i.ask b{color:var(--ink3);font-weight:500}
/* ใบเสร็จความร้อน */
#printArea{display:none}
.slip{font-family:"Sarabun","IBM Plex Sans Thai",Tahoma,sans-serif;color:#000;background:#fff;font-size:12px;line-height:1.35;padding:2mm 0}
.slip.p80{width:72mm}.slip.p58{width:48mm;font-size:11px}
.slip .sl-c{text-align:center}.slip .sl-logo{width:30mm;max-width:60%;height:auto;filter:grayscale(1) brightness(0);margin:0 auto 1mm;display:block}
.slip.p58 .sl-logo{width:22mm}
.slip .sl-b{font-weight:700;font-size:1.15em}.slip .sl-s{font-size:.92em}.slip .sl-t{font-weight:700;margin:1.5mm 0 1mm;font-size:1.1em;letter-spacing:.03em}
.slip .sl-r{display:flex;justify-content:space-between;gap:2mm}.slip .sl-r span:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.slip .sl-i{margin-top:1mm}.slip .sl-big{font-weight:700;font-size:1.3em;margin:1mm 0}
.slip .sl-hr{border-top:1px dashed #000;margin:1.5mm 0}
.slip-prev{display:flex;justify-content:center;background:#e9e9e9;padding:12px;border-radius:10px;max-height:65vh;overflow:auto}
.slip-prev .slip{padding:3mm;box-shadow:0 2px 8px rgba(0,0,0,.15)}
@media print{
  @page{margin:0}
  body *{visibility:hidden!important}
  #printArea,#printArea *{visibility:visible!important}
  #printArea{display:block!important;position:absolute;left:0;top:0}
  body{background:#fff!important}
}

/* Beam QR */
.bq-img{width:min(300px,72vw);aspect-ratio:1;max-width:100%;display:block;border-radius:12px;background:#fff;padding:6px}
.bq-img svg{width:100%;height:100%;display:block}
.bq-url{font-size:.75rem;word-break:break-all;max-width:100%}
.bq-amt{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums}
.prod .addnew{border:1.5px dashed var(--line,#c9d6d4);background:transparent}
input[type=date],input[type=time]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none}
.split>*,.cart,.cart .li .main{min-width:0}select{max-width:100%;min-width:0}.cart .li .t{overflow-wrap:anywhere}

.oc-wrap{overflow-x:auto;padding:.5rem}
.oc{display:grid;grid-template-columns:repeat(7,minmax(96px,1fr));gap:4px;min-width:700px}
.oc-h{text-align:center;font-size:.8rem;font-weight:600;color:var(--ink2);padding:.3rem 0}
.oc-d{min-height:96px;border:1px solid var(--line);border-radius:10px;padding:.35rem;display:flex;flex-direction:column;gap:.2rem;background:var(--surface);min-width:0}
.oc-d b{font-size:.85rem;color:var(--ink2)}
.oc-x{border:0;background:none}
.oc-we{background:var(--surface2)}.oc-h.oc-we{background:none;color:var(--bad)}
.oc-today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.oc-p{display:block;font-size:.76rem;line-height:1.25;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:.12rem .35rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oc-p.oc-w{background:var(--warn-soft);color:var(--warn)}
.row .oc-p{display:inline-block}

/* กล้องถ่ายบัตร */
.idc{position:relative;width:100%;aspect-ratio:4/3;max-height:62vh;background:#000;border-radius:14px;overflow:hidden}
.idc video,.idc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.idc img{object-fit:contain;background:#000;z-index:3}
.idc-mask{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:1}
.idc-fr{position:relative;width:min(84%,calc(62vh * 0.84 * 1.585 * .75));aspect-ratio:85.6/54;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.55);border:2px dashed rgba(255,255,255,.7)}
.idc-fr.ok{border:3px solid #4ade80}
.idc-fr i{position:absolute;width:28px;height:28px;border:4px solid #fff}
.idc-fr.ok i{border-color:#4ade80}
.idc-fr i:nth-child(1){left:-4px;top:-4px;border-right:0;border-bottom:0;border-top-left-radius:14px}
.idc-fr i:nth-child(2){right:-4px;top:-4px;border-left:0;border-bottom:0;border-top-right-radius:14px}
.idc-fr i:nth-child(3){left:-4px;bottom:-4px;border-right:0;border-top:0;border-bottom-left-radius:14px}
.idc-fr i:nth-child(4){right:-4px;bottom:-4px;border-left:0;border-top:0;border-bottom-right-radius:14px}
.idc-fr span{position:absolute;left:0;right:0;bottom:-2.1rem;text-align:center;color:#fff;font-size:.85rem;text-shadow:0 1px 3px #000}
.idc-st{position:absolute;left:50%;top:.7rem;transform:translateX(-50%);z-index:2;padding:.35rem .9rem;border-radius:99px;font-size:.9rem;font-weight:600;background:rgba(0,0,0,.6);color:#fff;white-space:nowrap}
.idc-st.ok{background:#15803d}.idc-st.bad{background:#b45309}
.oc-p.oc-v{background:var(--info-soft);color:var(--info)}

/* ตารางยอดเซลรายวัน */
.sb{border-collapse:collapse;font-size:.74rem;font-variant-numeric:tabular-nums;width:100%;min-width:max-content;background:var(--surface)}
.sb th,.sb td{border:1px solid var(--line);padding:.18rem .45rem;text-align:right;white-space:nowrap}
.sb th{background:var(--surface2);text-align:center;font-weight:700}
.sb td:first-child{text-align:center}
.sb .sb-t{background:color-mix(in srgb,var(--bad) 22%,var(--surface));font-weight:600}
.sb .sb-sum td.sb-g{background:#ffe600;color:#c00;font-weight:800}
.sb .sb-s{font-weight:600;font-size:.7rem}
.sb .sb-h{background:var(--surface)}
.sb .sb-n{color:var(--bad);font-weight:600;white-space:normal;max-width:34rem;text-align:right}
.sb .sb-sum td{font-weight:700;background:var(--surface2)}
.sb .sb-l{text-align:left!important;font-weight:700}
.sb .sb-gap td{border:0;height:.5rem;background:transparent}
.sb .sb-m td{color:#c026d3;font-weight:600}
.sb b.up{color:var(--good)}.sb b.dn{color:var(--bad)}
.sb-wrap{padding:.5rem}
.sb-full{position:fixed;inset:0;z-index:80;margin:0;border-radius:0;overflow:auto;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px));background:var(--surface)}
.sb-full .sb{font-size:.8rem;width:auto}
.sb-x{position:fixed;z-index:81;opacity:.85;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px))}

.sf-w{border-left:4px solid var(--warn)}

.qtr{display:flex;flex-wrap:wrap;gap:.15rem .3rem;align-items:center;font-size:.7rem;color:var(--ink3);margin-top:.15rem}
.qtr span{white-space:nowrap}.qtr span.on{color:var(--accent);font-weight:700}.qtr i{font-style:normal;opacity:.8}.qtr b{opacity:.5;font-weight:400}
@media (max-width:520px){.qrow{flex-wrap:wrap}.qrow>.stack.r{flex-direction:row;flex-wrap:wrap;width:100%;padding-left:3.4rem}}

.top .who[data-a]{cursor:pointer}
.top .outbtn{min-height:44px;min-width:60px;gap:.3rem;padding-inline:.7rem}

</style>

				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) || 
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {

			for (var col = 0; col < this.modules[row].length; col++) {

					qr_mc.beginFill(0, 100);

		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {

				var col = pos[j];
				
				if (this.modules[row][col] !== null) {

					for (var c = -2; c <= 2; c++) {

		for (var x = 0; x < 18; x++) {

			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;

		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

function makeCore(store) {
  var A = {};

  /* ---------- ตัวช่วยทั่วไป ---------- */
  function num(v) { var n = Number(String(v == null ? '' : v).replace(/,/g, '')); return isNaN(n) ? 0 : n; }
  function blank(v) { return v === '' || v == null; }
  function txt(v, max) { return String(v == null ? '' : v).replace(/\s+/g, ' ').trim().slice(0, max || 300); }
  function pad(n, l) { n = String(n); while (n.length < l) n = '0' + n; return n; }
  function r2(n) { return Math.round(n * 100) / 100; }
  function on(v) { return v === true || ['true', 'y', 'yes', '1', 'ใช่', 'ใช้'].indexOf(String(v).trim().toLowerCase()) >= 0; }
  function bkk(d) { return new Date((d || store.now()).getTime() + 7 * 3600e3); }
  function today() { return bkk().toISOString().slice(0, 10); }
  function stamp(d) { var x = bkk(d).toISOString(); return x.slice(0, 10) + ' ' + x.slice(11, 16); }
  function hm() { return bkk().toISOString().slice(11, 16); }
  function addDays(s, n) { var d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function toMin(t) { var p = String(t || '0:0').split(':'); return num(p[0]) * 60 + num(p[1]); }
  function fromMin(m) { return pad(Math.floor(m / 60), 2) + ':' + pad(m % 60, 2); }
  function minsSince(s) { if (!s) return 0; var t = Date.parse(String(s).replace(' ', 'T') + ':00+07:00'); return isNaN(t) ? 0 : Math.max(0, Math.round((store.now().getTime() - t) / 60000)); }
  function isDate(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')); }
  function normDate(s) { s = String(s || '').trim(); var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if (m) { var y = +m[3]; if (y > 2400) y -= 543; return y + '-' + pad(m[2], 2) + '-' + pad(m[1], 2); } return s.slice(0, 10); }
  function rows(t) { return store.rows(t); }
  function find(t, k, v) { var a = rows(t); for (var i = a.length - 1; i >= 0; i--) if (String(a[i][k]) === String(v)) return a[i]; return null; }
  function add(t, o) { return store.add(t, o); }
  function upd(t, r, p) { store.update(t, r, p); for (var k in p) r[k] = p[k]; }
  function nextId(prefix, key, len) { return prefix + pad(store.next(key), len || 6); }
  function setting(k, def) { var r = find('Settings', 'key', k); return r && !blank(r.value) ? r.value : def; }
  function sum(a, f) { var s = 0; for (var i = 0; i < a.length; i++) s += num(f ? f(a[i]) : a[i]); return r2(s); }
  function err(m) { throw new Error(m); }
  function log(u, a, d) { try { add('Log', { time: stamp(), user: (u.branch || '') + ' ' + u.code + ' ' + u.name, action: a, detail: String(d || '').slice(0, 500) }); } catch (e) {} }
  function roleOf(v) { var k = String(v || '').replace(/\s+/g, ' ').trim(); return ROLE_MAP[k.toLowerCase()] || ROLE_MAP[k] || ''; }
  function rolesOf(st) { var a = [roleOf(st.role), roleOf(st.role2)].filter(String); return a; }
  function canBranch(st, b) { var s = String(st.branches || '').trim(); if (!s || s === 'ทุกสาขา' || s.toUpperCase() === 'ALL') return true; return s.split(/[\s,]+/).indexOf(b) >= 0 || String(st.branch) === b; }
  function has(u, list) { if (u.roles.indexOf('admin') >= 0 || u.roles.indexOf('owner') >= 0) return true; for (var i = 0; i < u.roles.length; i++) if (list.indexOf(u.roles[i]) >= 0) return true; return false; }
  function priceAt(it, b) { var v = it['p_' + b]; return blank(v) ? null : num(v); }
  function typeOf(it) { return TYPE_MAP[String(it.type || '').trim()] || 'proc'; }
  function perfOf(it) { return PERF_MAP[String(it.performer || '').trim()] || 'doctor'; }
  function idValid(s) { s = String(s || ''); if (!/^\d{13}$/.test(s)) return false; var t = 0; for (var i = 0; i < 12; i++) t += +s[i] * (13 - i); return (11 - t % 11) % 10 === +s[12]; }
  function e164(p) { var d = String(p || '').replace(/[^\d+]/g, ''); if (!d) return ''; if (d[0] === '+') return d; if (d.indexOf('66') === 0 && d.length === 11) return '+' + d; if (d[0] === '0') return '+66' + d.slice(1); return '+' + d; }
  function csv(v) { var s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function brandOf(b) { var br = find('Branches', 'code', b); return br ? String(br.brand || '') : ''; }

  /* ---------- ตารางนัด (ล็อกห้อง/เตียง) ---------- */
  function roomsOf(b, type) { return rows('Rooms').filter(function (r) { return r.branch === b && on(r.active === '' ? true : r.active) && (!type || r.type === type); }); }
  function busy(b, date, exceptId) {
    var m = {};
    rows('Appointments').forEach(function (a) {
      if (a.branch !== b || a.date !== date || a.id === exceptId || ['BOOKED', 'ARRIVED'].indexOf(a.status) < 0) return;
      // มาสายเกิน 15 นาที (ยังไม่มา) = ปล่อยเตียงให้คนอื่น
      if (a.status === 'BOOKED' && date === today() && toMin(hm()) > toMin(a.cStart || a.start) + 15) return;
      (m[a.room] = m[a.room] || []).push([toMin(a.start), toMin(a.end)]);
      if (a.ipdRoom) (m[a.ipdRoom] = m[a.ipdRoom] || []).push([toMin(a.end), toMin(a.ipdEnd)]);
      if (a.cRoom) (m[a.cRoom] = m[a.cRoom] || []).push([toMin(a.cStart), toMin(a.cEnd)]);
    });
    return m;
  }
  function free(m, room, s, e) { return !(m[room] || []).some(function (x) { return s < x[1] && e > x[0]; }); }
  // ลูกค้าใหม่/รายการที่หมอทำ: จองห้องตรวจ (ปรึกษาแพทย์) ก่อน แล้วต่อห้องหัตถการทันที — จอง 2 ห้องต่อกันในนัดเดียว
  // ไม่ต้องตรวจก่อน: ติ๊กตอนลงนัด หรือรายการที่ตั้ง "ไม่ต้องพบแพทย์ก่อน" (เช่น เลเซอร์ขน คุยกับเซลแล้วทำเลย)
  function needFor(it, hn, o) {
    o = o || {};
    var perf = perfOf(it), dur = num(it.minutes) || 30, numb = num(it.numb), cm = Math.max(5, num(setting('consultMinutes', 10)) || 10);
    var consult = (perf === 'doctor' || perf === 'both' || !hn || !everSawDoctor(hn)) ? cm : 0;
    if (perf === 'staff' && hn && everSawDoctor(hn)) consult = 0;
    var ncCat = String(setting('noConsultCategories', 'กำจัดขน,Laser ขน')).split(/\s*,\s*/).indexOf(String(it.category)) >= 0, itNc = perf !== 'doctor' && (on(it.noConsult) || ncCat);
    if (o.noConsult || itNc) consult = 0;
    var type = String(it.roomType || '').trim(); if (!type || type === '-') type = perf === 'doctor' ? 'ห้องหัตถการแพทย์' : 'เตียงทรีทเม้นท์';
    return { dur: dur + numb, type: type, consult: consult, skip: consult === 0 && !!(o.noConsult || itNc), auto: itNc, ipd: type === 'ห้องผ่าตัด' ? num(setting('ipdMinutes', 90)) : 0 };
  }
  function findSlots(b, date, it, hn, exceptId, o) {
    var br = find('Branches', 'code', b);
    var open = toMin((br && br.open) || setting('open', '10:00')), close = toMin((br && br.close) || setting('close', '20:00'));
    var need = needFor(it, hn, o), m = busy(b, date, exceptId), out = [], hc = holClosed(b, date);
    if (hc) return { need: need, slots: [], closed: String(hc.name || 'วันหยุดนักขัตฯ') };
    var rs = roomsOf(b, need.type); if (!rs.length) rs = roomsOf(b, '').filter(function (r) { return r.type !== 'ห้องตรวจ' && r.type !== 'ห้อง IPD'; });
    var crs = roomsOf(b, 'ห้องตรวจ'), ipds = roomsOf(b, 'ห้อง IPD');
    var alt = roomsOf(b, '').filter(function (r) { return r.type !== 'ห้องตรวจ' && r.type !== 'ห้อง IPD' && rs.indexOf(r) < 0; }); // ห้องอื่นที่เลือกเองได้
    var nowMin = date === today() ? toMin(hm()) : -1;
    for (var t = open; t + need.consult + need.dur <= close; t += 15) {
      if (t < nowMin) continue;
      var cr = null;
      if (need.consult) { cr = crs.filter(function (r) { return free(m, r.name, t, t + need.consult); })[0]; if (!cr) continue; }
      var s = t + need.consult, e = s + need.dur, r = rs.filter(function (x) { return free(m, x.name, s, e); })[0];
      if (!r) continue;
      var ir = null;
      if (need.ipd && ipds.length) { ir = ipds.filter(function (x) { return free(m, x.name, e, e + need.ipd); })[0]; if (!ir) continue; }
      var fr = rs.concat(alt).filter(function (x) { return free(m, x.name, s, e); }).map(function (x) { return x.name; });
      out.push({ time: fromMin(t), room: r.name, rooms: fr, cRoom: cr ? cr.name : '', start: fromMin(s), end: fromMin(e), cStart: cr ? fromMin(t) : '', cEnd: cr ? fromMin(t + need.consult) : '',
        ipdRoom: ir ? ir.name : '', ipdEnd: ir ? fromMin(e + need.ipd) : '' });
    }
    return { need: need, slots: out };

function makeMemoryStore(seed, persistKey) {
  var db = { tables: {}, seq: {}, photos: {} }, cache = {};
  function load() {
    try { var s = persistKey && localStorage.getItem(persistKey); if (s) { var d = JSON.parse(s); if (d && d.v === seed.v) { db = d; return; } } } catch (e) {}
    db = { v: seed.v, tables: JSON.parse(JSON.stringify(seed.tables)), seq: JSON.parse(JSON.stringify(seed.seq || {})), photos: {} };
  }
  var dirty = false;
  function save() { dirty = true; }
  function flush() { if (!dirty || !persistKey) return; dirty = false; try { localStorage.setItem(persistKey, JSON.stringify(db)); } catch (e) {} }
  load();
  function T(t) { return db.tables[t] = db.tables[t] || []; }
  return {
    rows: function (t) { return T(t); },
    add: function (t, o) { var r = {}; for (var k in o) r[k] = o[k]; T(t).push(r); save(); return r; },
    update: function (t, row, p) { for (var k in p) row[k] = p[k]; save(); },
    remove: function (t, row) { var a = T(t), i = a.indexOf(row); if (i >= 0) a.splice(i, 1); save(); },
    next: function (k) { db.seq[k] = (db.seq[k] || 0) + 1; save(); return db.seq[k]; },
    lock: function (fn) { try { return fn(); } finally { flush(); } },
    propGet: function (k) { return (db.props || {})[k] || null; },
    propSet: function (k, v) { db.props = db.props || {}; db.props[k] = v; },
    propDel: function (k) { if (db.props) delete db.props[k]; },
    propClean: function (pre, now) { var p = db.props || {}; Object.keys(p).forEach(function (k) { if (k.indexOf(pre) === 0) { try { if (JSON.parse(p[k]).exp < now) delete p[k]; } catch (e) { delete p[k]; } } }); },
    cacheGet: function (k) { var c = cache[k]; if (!c) return null; if (c.exp < Date.now()) { delete cache[k]; return null; } return c.v; },
    cachePut: function (k, v, sec) { cache[k] = { v: v, exp: Date.now() + sec * 1000 }; },
    now: function () { return new Date(); },
    uuid: function () { return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) { var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }); },
    hash: sha256,
    savePhoto: function (name, dataUrl) { var id = 'img_' + Object.keys(db.photos).length + '_' + name; db.photos[id] = String(dataUrl || ''); save(); return id; },
    getPhoto: function (id) { return db.photos[id] || ''; },
    // โหมดทดลอง: จำลอง LINE (idToken = 'demo:' + userId)
    verifyLine: function (t) { var m = String(t).match(/^demo:(U[\w-]+)(?:\|(.*))?$/); return m ? { sub: m[1], name: m[2] || 'ผู้ใช้ LINE (ทดลอง)', picture: '' } : null; },
    // โหมดทดลอง: จำลอง Beam (กดจ่ายในหน้าจำลอง)
    beamDemoPay: function (id) { var x = (db.beam || {})[id]; if (x) { x.paid = true; save(); } },
    beamReady: function () { return true; },
    beam: function (method, path, body) {
      var bm = db.beam = db.beam || {}, m;
      if (method === 'POST' && path === '/api/v1/charges') { var id = 'ch_demo' + Date.now().toString(36); bm[id] = { t: Date.now(), amount: body.amount };
        return { code: 201, json: { chargeId: id, actionRequired: 'ENCODED_IMAGE', paymentMethodType: 'QR_PROMPT_PAY', encodedImage: { rawData: 'DEMO-PROMPTPAY|' + id + '|' + body.amount / 100, expiry: body.paymentMethod.qrPromptPay.expiryTime } } }; }

    sendMail: function (m) { (db.mail = db.mail || []).push({ to: m.to, subject: m.subject, time: new Date().toISOString() }); if (db.mail.length > 20) db.mail.shift(); save(); return true; },

/* ---------- กล้องถ่ายบัตร: กรอบบัตร + เช็คเบลอ/มืด/แสงสะท้อน + ตัดเฉพาะในกรอบ ---------- */
var ID_RATIO = 85.6 / 54;
function sharpOf(ctx, w, h) {   // ความคม = variance ของ Laplacian บนภาพขาวดำ · ความสว่างเฉลี่ย · สัดส่วนจุดสว่างจ้า
  var d = ctx.getImageData(0, 0, w, h).data, g = new Float32Array(w * h), i, sum = 0, glare = 0;
  for (i = 0; i < w * h; i++) { var v = .299 * d[i * 4] + .587 * d[i * 4 + 1] + .114 * d[i * 4 + 2]; g[i] = v; sum += v; if (v > 248) glare++; }
  var n = 0, m = 0, m2 = 0;
  for (var y = 1; y < h - 1; y++) for (var x = 1; x < w - 1; x++) { var k = y * w + x, l = 4 * g[k] - g[k - 1] - g[k + 1] - g[k - w] - g[k + w]; n++; m += l; m2 += l * l; }
  m /= n; return { sharp: m2 / n - m * m, light: sum / (w * h), glare: glare / (w * h) };
}
function qualMsg(q) { return q.light < 55 ? 'มืดไป — เปิดไฟหรือย้ายไปที่สว่าง' : q.glare > .06 ? 'แสงสะท้อนบนบัตร — เอียงบัตรเล็กน้อย' : q.sharp < 60 ? 'ภาพเบลอ — ถือนิ่งๆ แล้วถ่ายใหม่' : ''; }

    var timer = null, shot = '';

    return dialog({ title: 'ถ่ายรูปบัตร', ok: false, cancel: 'ยกเลิก', wide: true, noFocus: true,
      body: '<div class="idc"><video id="idv" playsinline muted autoplay></video><div class="idc-mask"><div class="idc-fr" id="idfr"><i></i><i></i><i></i><i></i><span>วางบัตรให้เต็มกรอบ</span></div></div><div class="idc-st" id="idst">กำลังเปิดกล้อง…</div><img id="idpv" alt="" hidden></div>' +
        '<div class="row" id="idbt1"><span class="xs muted sp">ถือแท็บเล็ตขนานกับบัตร · ไม่ให้นิ้วบังตัวหนังสือ · หลบแสงไฟสะท้อน</span><button type="button" class="btn p lg" id="idsnap">' + ic('cam', 20) + ' ถ่าย</button></div>' +
        '<div class="row" id="idbt2" hidden><span class="sp small" id="idq"></span><button type="button" class="btn" id="idre">ถ่ายใหม่</button><button type="button" class="btn p" id="iduse">ใช้รูปนี้</button></div>',
      mount: function (box) {
        var v = box.querySelector('#idv'), fr = box.querySelector('#idfr'), st = box.querySelector('#idst'), pv = box.querySelector('#idpv'), b1 = box.querySelector('#idbt1'), b2 = box.querySelector('#idbt2');
        v.srcObject = stream; v.play().catch(function () {});
        function rectInVideo() {   // กรอบบนจอ → พิกัดในวิดีโอ (วิดีโอแสดงแบบ object-fit: cover)
          var vb = v.getBoundingClientRect(), fb = fr.getBoundingClientRect(), vw = v.videoWidth, vh = v.videoHeight, sc = Math.max(vb.width / vw, vb.height / vh), ox = (vw * sc - vb.width) / 2, oy = (vh * sc - vb.height) / 2;

          var qe = box.querySelector('#idq'); qe.textContent = m ? '⚠️ ' + m : 'ชัดดี ✓'; qe.className = 'sp small ' + (m ? 'dn' : 'up'); };

// แบ่งยอดผู้ขายเป็น "บาท" (ระบบแปลงเป็น % ให้เองตอนบันทึก) · total() = ยอดรวมที่จะแบ่ง
function bindSellers(root, arr, total) {
  var w = root.querySelector('[data-spl]'); total = total || function () { return 100; };
  function T() { return Math.max(0, Math.round(nz(total()) * 100) / 100); }
  function eq() { var t = T(), n = arr.length; arr.forEach(function (x, i) { x.amt = i < n - 1 ? Math.round(t / n) : Math.round((t - Math.round(t / n) * (n - 1)) * 100) / 100; }); }
  function left() { return Math.round((T() - arr.reduce(function (s, x) { return s + nz(x.amt); }, 0)) * 100) / 100; }
  function hint() { var h = w.querySelector('[data-left]'); if (!h) return; var l = left(); h.textContent = l === 0 ? 'ครบ ' + fm(T()) + ' บาท' : l > 0 ? 'ยังเหลือ ' + fm(l) + ' บาท' : 'เกิน ' + fm(-l) + ' บาท'; h.className = 'xs ' + (l === 0 ? 'muted' : 'dn'); }
  function draw() { w.innerHTML = arr.length > 1 ? '<div class="row" style="gap:.4rem .8rem">' + arr.map(function (x, i) { return '<label style="flex-direction:row;align-items:center;gap:.3rem">' + esc(x.name) + '<input data-sp-i="' + i + '" type="number" inputmode="decimal" value="' + x.amt + '" style="width:96px;min-height:34px;padding:.2rem .4rem">฿</label>'; }).join('') + '</div><span data-left></span>' : ''; hint(); }
  root.querySelector('[data-sp]').onclick = function (e) { var b = e.target.closest('[data-sn]'); if (!b) return; var i = arr.map(function (x) { return x.name; }).indexOf(b.dataset.sn); if (i >= 0) arr.splice(i, 1); else arr.push({ name: b.dataset.sn, pct: 100 }); b.classList.toggle('on', i < 0); eq(); draw(); };
  w.oninput = function (e) { var i = e.target.dataset.spI; if (i != null) { arr[+i].amt = nz(e.target.value); hint(); } };
  arr.sync = function () { var t = T(), cur = arr.reduce(function (s, x) { return s + nz(x.amt); }, 0); if (arr.length > 1 && Math.abs(cur - t) > 0.01) { if (cur > 0) { var acc = 0; arr.forEach(function (x, i) { x.amt = i < arr.length - 1 ? Math.round(nz(x.amt) * t / cur) : Math.round((t - acc) * 100) / 100; acc += x.amt; }); } else eq(); draw(); } };
  arr.toPct = function () { if (arr.length < 2) { arr.forEach(function (x) { x.pct = 100; }); return true; } var t = T(); if (!(t > 0)) { eq(); } if (Math.abs(left()) > 0.5) { toast('ยอดแบ่งผู้ขายยังไม่ครบ — ' + w.querySelector('[data-left]').textContent, 1); return false; }
    var acc = 0; arr.forEach(function (x, i) { x.pct = i < arr.length - 1 ? Math.round(nz(x.amt) / t * 1e6) / 1e4 : Math.round((100 - acc) * 1e4) / 1e4; acc += x.pct; }); return true; };
  if (arr.length > 1 && arr[0].amt == null) eq();
  draw();
}

        '<tr><td class="sb-l">ส่วนต่าง</td><td>' + (tgt.total ? sign(grand - tgt.total) : '') + '</td>' + cs.map(function (c) { var v = tgt.by[c.key]; return '<td colspan="' + (c.split ? 2 : 1) + '">' + (v ? sign(actOf(c) - v) : '') + '</td>'; }).join('') + '</tr>' +
        '<tr class="sb-gap"><td colspan="' + (2 + sub.length) + '"></td></tr>' +
        '<tr class="sb-m"><td class="sb-l">ยอดเฉลี่ยต่อวันตาม Target</td><td>' + (tgt.total ? f2(perDay(tgt.total)) : '') + '</td>' + cs.map(function (c) { var v = tgt.by[c.key]; return '<td colspan="' + (c.split ? 2 : 1) + '">' + (v ? f2(perDay(v)) : '') + '</td>'; }).join('') + '</tr>' +
        '<tr><td class="sb-l">Target สะสมถึงวันที่ ' + r.elapsed + '</td><td class="b">' + (tgt.total ? f2(cum(tgt.total)) : '') + '</td>' + cs.map(function (c) { var v = tgt.by[c.key]; return '<td colspan="' + (c.split ? 2 : 1) + '">' + (v ? f2(cum(v)) : '') + '</td>'; }).join('') + '</tr>' +
        '<tr><td class="sb-l">ส่วนต่าง (เทียบสะสม)</td><td>' + (tgt.total ? sign(grand - cum(tgt.total)) : '') + '</td>' + cs.map(function (c) { var v = tgt.by[c.key]; return '<td colspan="' + (c.split ? 2 : 1) + '">' + (v ? sign(actOf(c) - cum(v)) : '') + '</td>'; }).join('') + '</tr>' : '') + '</tfoot></table>';
    return '<div class="stack"><div class="row"><button class="btn" data-a="sbNav" data-n="-1">‹</button><h2 style="min-width:10rem;text-align:center">' + TH_MN[m - 1] + ' ' + (y + 543) + '</h2><button class="btn" data-a="sbNav" data-n="1">›</button><span class="sp"></span>' +
      (r.canAll ? '<select id="sbbr" style="width:auto">' + r.branches.map(function (b) { return '<option value="' + esc(b.code) + '"' + (b.code === r.branch ? ' selected' : '') + '>' + esc(b.name) + '</option>'; }).join('') + '</select>' : '') +
      '<button class="btn" data-a="sbFull">⛶ เต็มจอ (ไว้แคป)</button></div>' +
      '<div class="card tbl sb-wrap" id="sbw">' + tbl + '</div>' +
      '<p class="xs muted">คิดจาก<b>เงินจริงที่รับ</b> (หลังหักมัดจำ/วงเงิน) ตามผู้ขายที่เลือกตอนรับเงิน · ยอด Page = ส่วนที่แอดมินเพจปิด · ยอดคลินิก = ไม่มีเซล · เป้าแก้ได้ที่แท็บ <b>Targets</b> ใน CLINICDB (เดือน · สาขา · ใคร · เป้า) · ข้อความสีแดงแก้ที่ Settings: salesBoardNote</p></div>';
  });
};
SCR.salesBoard.after = function () { var s = $('#sbbr'); if (s) s.onchange = function () { S.v.sbBr = s.value; refresh(); }; };
ACT.sbNav = function (el) { var mo = S.v.sbMon, y = +mo.slice(0, 4), m = +mo.slice(5, 7) - 1 + +el.dataset.n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; S.v.sbMon = y + '-' + ('0' + (m + 1)).slice(-2); refresh(); };
// เต็มจอ: ย่อตารางทั้งเดือนให้พอดีจอเดียว → แคปหน้าจอได้ทีเดียวจบ
ACT.sbFull = function () { var w = $('#sbw'); if (!w) return; var t = w.querySelector('.sb'), on = w.classList.toggle('sb-full');
  function fit() { t.style.transform = ''; if (!w.classList.contains('sb-full')) return; var sc = Math.min(1, (w.clientWidth - 24) / t.offsetWidth, (w.clientHeight - 24) / t.offsetHeight); t.style.transformOrigin = 'top left'; t.style.transform = 'scale(' + sc + ')'; }
  if (on) { var x = document.createElement('button'); x.className = 'btn p sb-x'; x.textContent = '✕ ปิด'; x.onclick = function () { w.classList.remove('sb-full'); t.style.transform = ''; x.remove(); removeEventListener('resize', fit); }; document.body.appendChild(x); addEventListener('resize', fit); setTimeout(fit, 30); } else fit(); };

TITLES.saleFeed = 'ยอดขายวันนี้ (สด)';
SCR.saleFeed = function () {
  return call('saleFeed', { date: S.v.sfDate, branch: S.v.sfBr }).then(function (r) {
    return '<div class="stack" style="max-width:640px;margin:0 auto"><div class="row"><input type="date" id="sfd" value="' + r.date + '" max="' + today() + '" style="width:auto">' +
      (r.canAll ? '<select id="sfb" style="width:auto"><option value="">ทุกสาขา</option>' + r.branches.map(function (b) { return '<option value="' + esc(b.code) + '"' + (b.code === S.v.sfBr ? ' selected' : '') + '>' + esc(b.name) + '</option>'; }).join('') + '</select>' : '') + '</div>' + saleFeedHtml(r) + '</div>';
  });
};
SCR.saleFeed.after = function () { $('#sfd').onchange = function (e) { S.v.sfDate = e.target.value; refresh(); }; var b = $('#sfb'); if (b) b.onchange = function () { S.v.sfBr = b.value; refresh(); }; };
POLL.saleFeed = 1;

/* ---------- ยืนยันค่ามือรายวัน: แพทย์ (DF) / พนักงาน (ค่ามือ) — ผู้จัดการตรวจ → กดยืนยัน → ขึ้นในมือถือ ---------- */
TITLES.feeConfDf = 'ยืนยันค่ามือแพทย์'; TITLES.feeConfFee = 'ยืนยันค่ามือพนักงาน'; TITLES.feeDayV = 'ตรวจค่ามือรายวัน';
function feeKName(k) { return k === 'df' ? 'ค่ามือแพทย์ (DF)' : 'ค่ามือพนักงาน'; }
function feeStPill(st) { return st === 'CONFIRMED' ? '<span class="pill g">ยืนยันแล้ว ✓</span>' : st === 'OLD' ? '<span class="pill">ก่อนเริ่มระบบยืนยัน</span>' : '<span class="pill w">รอยืนยัน</span>'; }
function feeBrSel(id) {
  if (!has(['owner', 'admin', 'account'])) return '';
  return '<select id="' + id + '" style="width:auto">' + opts((S.boot.branches || []).map(function (b) { return [b.code, b.name]; }), S.v.feeBr || S.user.branch) + '</select>';
}
function feeConfList(k) {
  return call('feeDays', { kind: k, branch: S.v.feeBr || '' }).then(function (r) {
    var wait = r.days.filter(function (d) { return d.status !== 'CONFIRMED'; }).length;
    return '<div class="stack"><div class="row">' + feeBrSel('fbr') + '<span class="sp small muted">' + esc(feeKName(k)) + ' · ยืนยันแล้วถึงขึ้นในมือถือ' + (k === 'df' ? 'แพทย์' : 'พนักงาน') + ' · เริ่มใช้ ' + thDate(r.from) + '</span>' +
      (wait ? '<span class="pill w">รอยืนยัน ' + wait + ' วัน</span>' : '') + '</div>' +
      (r.days.length ? '<div class="card"><div class="list">' + r.days.map(function (d) {
        return '<button class="li" style="text-align:left;width:100%" data-go="feeDayV" data-arg="' + k + '|' + d.date + '"><div class="main"><div class="t">' + thDate(d.date, 1) + ' · ' + bt(d.total) + ' <span class="small muted">(' + d.n + ' รายการ)</span></div>' +
          '<div class="s">' + esc(d.people.map(function (x) { return x.name + ' ' + fm(x.amount); }).join(' · ')) + (d.by ? ' · ยืนยันโดย ' + esc(d.by) : '') + '</div></div>' + feeStPill(d.status) + '</button>';
      }).join('') + '</div></div>' : '<div class="card"><div class="empty">ยังไม่มีค่ามือในช่วงนี้</div></div>') + '</div>';
  });
}
SCR.feeConfDf = function () { return feeConfList('df'); };
SCR.feeConfFee = function () { return feeConfList('fee'); };
SCR.feeConfDf.after = SCR.feeConfFee.after = function () { var s = $('#fbr'); if (s) s.onchange = function () { S.v.feeBr = s.value; refresh(); }; };
SCR.feeDayV = function (arg) {
  var a = String(arg).split('|'), k = a[0], d = a[1];
  return call('feeDay', { kind: k, date: d, branch: S.v.feeBr || '' }).then(function (r) {
    S.v.feeDay = r; var open = r.status === 'OPEN', edit = open && r.canEdit, by = {};
    r.items.forEach(function (i) { (by[i.who] = by[i.who] || { name: i.whoName, items: [], total: 0 }).items.push(i); by[i.who].total += i.amount; });
    var ppl = Object.keys(by).map(function (c) { return by[c]; }).sort(function (x, y) { return y.total - x.total; });
    var head = '<div class="card stack"><div class="row"><div class="sp"><div class="small muted">' + esc(feeKName(k)) + ' · ' + esc(r.branch) + '</div><h2>' + thDate(d, 1) + '</h2></div>' + feeStPill(r.status) + '</div>' +
      '<div class="row"><b class="sp">รวม ' + bt(r.total) + '</b><span class="small muted">' + r.items.length + ' รายการ · ' + ppl.length + ' คน</span></div>' +
      (r.status === 'CONFIRMED' ? '<div class="small muted">ยืนยันโดย ' + esc(r.by) + ' · ' + esc(r.at) + ' — ขึ้นในมือถือแล้ว</div>' : r.status === 'OPEN' ? '<div class="note w small">ยังไม่ขึ้นในมือถือ' + (k === 'df' ? 'แพทย์' : 'พนักงาน') + ' — ตรวจทีละรายการ ถ้าถูกแล้วกด "ยืนยัน"' + (r.note ? '<br>เปิดแก้เพราะ: ' + esc(r.note) : '') + '</div>' : '') +
      (edit ? '<button class="btn p lg" style="width:100%" data-a="feeOk">ยืนยัน ' + bt(r.total) + ' → ส่งขึ้นมือถือ</button>' : '') +
      (r.status === 'CONFIRMED' && r.canEdit ? '<button class="btn" data-a="feeReopen">เปิดแก้</button>' : '') + '</div>';
    var body = ppl.map(function (p) {
      return '<div class="card stack"><div class="sec"><h2>' + esc(p.name) + '</h2><b>' + bt(p.total) + '</b></div><div class="list">' + p.items.map(function (i) {
        var how = k === 'df' ? (i.base ? fm(i.base) + ' × ' + i.pct + '%' : 'DF คงที่') + (i.estimated ? ' · ประมาณ (ยังไม่จ่ายเงิน)' : '') : esc(i.kind) + (i.qty > 1 ? ' · ' + i.qty + ' หน่วย' : '');
        return '<div class="li"><div class="main"><div class="t">' + esc(i.item) + '</div><div class="s">' + esc(i.hn + ' ' + i.name) + ' · ' + how + '</div></div><b>' + bt(i.amount) + '</b>' +
          (edit && i.oid ? '<button class="btn sm q" data-a="feeFix" data-id="' + esc(i.oid) + '" data-who="' + esc(i.who) + '">แก้</button>' : '') + '</div>';
      }).join('') + '</div></div>';
    }).join('');
    var hist = r.history.length ? '<details class="card"><summary class="small">ประวัติการแก้ / ยืนยัน (' + r.history.length + ')</summary><div class="list small">' + r.history.map(function (h) {
      return '<div class="li"><div class="main"><div class="t">' + esc({ feeEdit: 'แก้', feeConfirm: 'ยืนยัน', feeReopen: 'เปิดแก้' }[h.action] || h.action) + ' · ' + esc(h.user) + '</div><div class="s">' + esc(h.time + ' · ' + h.detail) + '</div></div></div>'; }).join('') + '</div></details>' : '';
    return '<div class="stack">' + head + (body || '<div class="card"><div class="empty">ไม่มีรายการ</div></div>') + hist + '</div>';
  });
};
ACT.feeOk = function () {
  var r = S.v.feeDay;
  ask('ยืนยัน' + feeKName(r.kind), thDate(r.date, 1) + ' · รวม <b>' + bt(r.total) + '</b> (' + r.items.length + ' รายการ)<br>ยืนยันแล้วจะขึ้นในมือถือ' + (r.kind === 'df' ? 'แพทย์' : 'พนักงาน') + 'ทันที · ถ้าผิดทีหลังกด "เปิดแก้" ได้', 'ยืนยัน ส่งขึ้นมือถือ').then(function (ok) {
    if (!ok) return; call('feeConfirm', { kind: r.kind, date: r.date, branch: r.branch }, { write: true }).then(function () { toast('ยืนยันแล้ว · ขึ้นในมือถือแล้ว'); refresh(); }).catch(fail); });
};
ACT.feeReopen = function () {
  var r = S.v.feeDay;
  dialog({ title: 'เปิดแก้' + feeKName(r.kind), ok: 'เปิดแก้', body: '<p class="small">' + thDate(r.date, 1) + ' — ระหว่างเปิดแก้ รายการวันนี้จะหายจากมือถือจนกว่าจะกดยืนยันใหม่</p><label>เหตุผล *<input id="frw" placeholder="เช่น ค่ามือ Pcell ผิด / ใส่ผู้ช่วยผิดคน"></label>',
    onOk: function (b) { return call('feeReopen', { kind: r.kind, date: r.date, branch: r.branch, reason: need(b.querySelector('#frw').value.trim(), 'ใส่เหตุผล') }, { write: true }).then(function () { toast('เปิดแก้แล้ว'); refresh(); }); } });
};
ACT.feeFix = function (el) {
  var r = S.v.feeDay, i = r.items.filter(function (x) { return x.oid === el.dataset.id && x.who === el.dataset.who; })[0] || r.items.filter(function (x) { return x.oid === el.dataset.id; })[0];
  var docs = r.staff.filter(function (s) { return s.doctor; }), sel = i.staffs.slice();
  var body = '<div class="card flat small"><b>' + esc(i.item) + '</b><br>' + esc(i.hn + ' ' + i.name) + '</div>' + (r.kind === 'df'
    ? '<label>แพทย์ผู้ทำ<select id="ffd">' + opts(docs.map(function (s) { return [s.code, s.name]; }), i.doctor, '— ไม่มี —') + '</select></label>' +
      '<div class="g2"><label>DF %<input id="ffp" type="number" inputmode="decimal" min="0" max="100" step="0.5" value="' + (i.dfFixed ? '' : i.dfPct) + '"></label>' +
      '<label>หรือ DF บาท/ครั้ง (แทน %)<input id="fff" type="number" inputmode="decimal" min="0" value="' + (i.dfFixed || '') + '"></label></div><p class="small muted">ฐานคิด DF: ' + bt(i.base) + (i.qty > 1 ? ' × ' + i.qty : '') + '</p>'
    : '<label>ผู้ทำ / ผู้เตรียม (เลือกได้หลายคน · หารเท่ากัน)</label><div class="chips" id="ffs">' + r.staff.filter(function (s) { return !s.doctor; }).map(function (s) {
        return '<button type="button" data-c="' + esc(s.code) + '" class="' + (sel.indexOf(s.code) >= 0 ? 'on' : '') + '">' + esc(s.name) + '</button>'; }).join('') + '</div>' +
      '<label>' + (i.prep ? 'ค่ามือตอนเตรียมให้หมอ' : 'ค่ามือ') + ' (บาท/ครั้ง)<input id="ffm" type="number" inputmode="decimal" min="0" value="' + i.fee + '"></label>' +
      (i.qty > 1 ? '<p class="small muted">รายการนี้ ' + i.qty + ' หน่วย — ระบบคูณ/คิดหน่วยถัดไปให้ตามกติกาค่ามือ</p>' : ''));
  dialog({ title: 'แก้' + (r.kind === 'df' ? ' DF แพทย์' : 'ค่ามือ'), ok: 'บันทึก', body: body, noFocus: true,
    mount: function (b) { var c = b.querySelector('#ffs'); if (c) c.onclick = function (e) { var x = e.target.closest('[data-c]'); if (!x) return; var j = sel.indexOf(x.dataset.c); if (j >= 0) sel.splice(j, 1); else sel.push(x.dataset.c); x.classList.toggle('on', j < 0); }; },
    onOk: function (b) {
      var p = r.kind === 'df' ? { doctor: b.querySelector('#ffd').value, dfPct: b.querySelector('#ffp').value, dfFixed: b.querySelector('#fff').value } : { staffs: sel, fee: b.querySelector('#ffm').value };
      p.kind = r.kind; p.oid = i.oid;
      return call('feeEdit', p, { write: true }).then(function (x) { toast(x && x.changed ? 'แก้แล้ว · บันทึกประวัติไว้' : 'ไม่มีอะไรเปลี่ยน'); refresh(); });
    } });
};

// เปิดผ่าน http:// กล้อง/ตำแหน่งจะใช้ไม่ได้ → เด้งไป https อัตโนมัติ (เฉพาะเว็บจริง ไม่ใช่ไฟล์ทดสอบ)
if (location.protocol === 'http:' && /github\.io$/.test(location.hostname)) location.replace('https://' + location.host + location.pathname + location.search);
/* เริ่มระบบ */
(function () {
  var tok = LS.get('hs_tok') || LS.sget('hs_tok'), u = LS.get('hs_user') || LS.sget('hs_user');
  if (tok && u && !DEMO) { S.token = tok; S.user = JSON.parse(u); start(); return; }
  loginScreen(LS.get('hs_br', '') ? 'pin' : '');
})();
