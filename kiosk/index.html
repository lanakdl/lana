<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lana Check-in</title>
<meta name="theme-color" content="#3c2219">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Gilda+Display&family=Noto+Serif+Thai:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>

/* Layout: a phone showing the shop's LINE OA, with a "shop side" control panel beside it (above it on phones) */
:root {
  --paper: #f7eedf; --card: #fffaf1; --ink: #3c2219; --ink-2: #7b6352; --olive: #6c7454; --olive-ink: #fffaf1;
  --sand: #ead6b6; --line: #e2d1b6; --mute: #b9a993; --ok: #5e7a45; --warn: #a3542f; --chat: #e9e2d4; --bubble: #ffffff; --me: #d9e2c4;
  --stage: #efe6d6;
  --f-display: 'Gilda Display', 'Noto Serif Thai', Georgia, serif;
  --f-thai: 'Noto Serif Thai', 'Gilda Display', Georgia, serif;
  --f-body: 'Anuphan', 'Noto Sans Thai', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1d1612; --card: #29201a; --ink: #f2e4cf; --ink-2: #bba58c; --olive: #a7b287; --olive-ink: #1d1612;
  --sand: #4a3a2a; --line: #3b2f25; --mute: #6c5d4d; --ok: #9cbf7c; --warn: #e39a72; --chat: #231b16; --bubble: #2f2520; --me: #3c4430; --stage: #141009; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1d1612; --card: #29201a; --ink: #f2e4cf; --ink-2: #bba58c; --olive: #a7b287; --olive-ink: #1d1612;
  --sand: #4a3a2a; --line: #3b2f25; --mute: #6c5d4d; --ok: #9cbf7c; --warn: #e39a72; --chat: #231b16; --bubble: #2f2520; --me: #3c4430; --stage: #141009; color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--stage); color: var(--ink); font-family: var(--f-body); font-size: 14.5px; line-height: 1.5; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--olive); outline-offset: 2px; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; }
:lang(th) h2, :lang(th) h3 { font-family: var(--f-thai); font-weight: 600; }

.stage { min-height: 100%; display: flex; gap: 28px; justify-content: center; align-items: flex-start; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sim { width: 300px; flex: 0 0 auto; display: grid; gap: 12px; position: sticky; top: 24px; }
.sim .intro { display: grid; gap: 6px; }
.sim h1 { font-family: var(--f-display); font-size: 26px; line-height: 1.15; }
.sim p { margin: 0; color: var(--ink-2); font-size: 13px; }
.clock { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-variant-numeric: tabular-nums; }
.clock b { font-size: 18px; }
.simbtns { display: grid; gap: 8px; }
.simbtns .lbl { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.sbtn { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; font-size: 13.5px; }
.sbtn:hover:not(:disabled) { border-color: var(--olive); }
.sbtn:disabled { opacity: .45; }
.sbtn small { display: block; color: var(--ink-2); font-size: 12px; }
.linkbtn { background: none; border: 0; color: var(--ink-2); text-decoration: underline; padding: 0; font-size: 12.5px; justify-self: start; }

.phone { width: 390px; max-width: 100%; height: min(820px, calc(100dvh - 48px)); min-height: 600px; flex: 0 0 auto; background: var(--chat); border-radius: 34px; border: 8px solid var(--ink); position: relative; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgb(40 20 10 / .18); }
.chead { background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 16px 10px; display: flex; align-items: center; gap: 10px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--olive); color: var(--olive-ink); display: grid; place-items: center; font-family: var(--f-display); font-size: 18px; }
.chead b { display: block; font-size: 14px; }
.chead span { font-size: 11.5px; color: var(--ink-2); }
.chat { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 82%; background: var(--bubble); border-radius: 16px 16px 16px 4px; padding: 9px 12px; font-size: 14px; white-space: pre-line; }
.msg.me { align-self: flex-end; background: var(--me); border-radius: 16px 16px 4px 16px; }
.msg .meta { display: block; font-size: 10.5px; color: var(--ink-2); margin-top: 3px; }
.sysnote { align-self: center; font-size: 11.5px; color: var(--ink-2); background: var(--card); border-radius: 999px; padding: 3px 10px; }

.rmbar { background: var(--card); border-top: 1px solid var(--line); text-align: center; font-size: 12.5px; padding: 6px; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; }
.rm { position: relative; line-height: 0; }
.rm img { width: 100%; display: block; }
.rm .hit { position: absolute; background: transparent; border: 0; padding: 0; }
.rm .hit:hover, .rm .hit:focus-visible { background: rgb(255 255 255 / .12); outline: 2px solid var(--olive); outline-offset: -2px; }
.rm .dot { position: absolute; top: 8px; right: 10px; width: 12px; height: 12px; border-radius: 50%; background: var(--warn); border: 2px solid var(--card); }

.liff { position: absolute; inset: 0; background: var(--paper); display: flex; flex-direction: column; z-index: 5; }
.lhead { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px; border-bottom: 1px solid var(--line); background: var(--paper); }
.lhead h2 { flex: 1; font-family: var(--f-display); font-size: 20px; }
.x { background: none; border: 0; font-size: 22px; line-height: 1; padding: 4px 8px; color: var(--ink-2); }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.lang button { background: none; border: 0; padding: 3px 10px; font-size: 12px; color: var(--ink-2); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.lbody { flex: 1; overflow-y: auto; padding: 4px 16px 24px; }
.lfoot { border-top: 1px solid var(--line); background: var(--card); padding: 10px 14px 14px; display: flex; gap: 10px; align-items: center; }
.lfoot .sum { flex: 1; min-width: 0; font-size: 12.5px; color: var(--ink-2); }
.lfoot .sum b { display: block; color: var(--ink); font-size: 16px; }

.sec { padding-block: 16px; border-bottom: 1px dashed var(--line); display: grid; gap: 10px; }
.sec:last-child { border-bottom: 0; }
.sec h3 { font-size: 16px; display: flex; gap: 8px; align-items: baseline; }
.sec h3 .n { font-family: var(--f-body); font-size: 11.5px; font-weight: 600; color: var(--olive); }
.hint { margin: 0; color: var(--ink-2); font-size: 13px; }
.btn { background: var(--ink); color: var(--paper); border: 0; border-radius: 999px; padding: 11px 20px; font-weight: 600; white-space: nowrap; }
.btn:disabled { opacity: .35; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.small { padding: 7px 14px; font-size: 13px; }
.btn.block { width: 100%; }
.row2 { display: flex; gap: 8px; flex-wrap: wrap; }
.row2 .btn { flex: 1; }

.opt { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; text-align: left; display: grid; gap: 3px; width: 100%; }
.opt[aria-pressed="true"] { border-color: var(--olive); box-shadow: inset 0 0 0 1px var(--olive); }
.opt:disabled { opacity: .5; }
.opt .t { font-weight: 600; }
.opt .s { font-size: 12.5px; color: var(--ink-2); }
.opts { display: grid; gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.badge { justify-self: start; font-size: 10.5px; font-weight: 600; letter-spacing: .04em; border-radius: 999px; padding: 1px 8px; background: var(--sand); color: var(--ink); }
.badge.olive { background: var(--olive); color: var(--olive-ink); }
.price { font-variant-numeric: tabular-nums; }
.strike { text-decoration: line-through; color: var(--mute); }

.pcard { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 8px; }
.pcard h3 { font-size: 17px; }
.pcard .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.pcard .dur { font-family: var(--f-display); font-size: 22px; white-space: nowrap; }
.pcard .dur small { font-family: var(--f-body); font-size: 11px; color: var(--ink-2); }
.pcard p { margin: 0; font-size: 13.5px; }
.steps { display: flex; height: 8px; border-radius: 999px; overflow: hidden; gap: 2px; }
.steps span { display: block; height: 100%; }
.stepl { display: grid; gap: 2px; font-size: 12.5px; color: var(--ink-2); }
.stepl div { display: flex; gap: 8px; align-items: center; }
.stepl i { width: 9px; height: 9px; border-radius: 3px; flex: 0 0 auto; }
.c0 { background: var(--olive); } .c1 { background: #c79a6b; } .c2 { background: #d9c3a1; } .c3 { background: #8b5a3c; }
.packs { display: grid; gap: 6px; font-size: 13px; }
.packs div { display: flex; justify-content: space-between; gap: 8px; }

.hair { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.hair .opt .t { font-size: 12px !important; line-height: 1.25; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
.chip small { color: var(--ink-2); font-size: 11.5px; }
.chip[aria-pressed="true"] { background: var(--olive); color: var(--olive-ink); border-color: var(--olive); }
.chip[aria-pressed="true"] small { color: var(--olive-ink); }
.prefs { display: grid; gap: 8px; border-top: 1px dashed var(--line); padding-top: 10px; }
.prow { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px; align-items: center; font-size: 13px; }
.prow > span { color: var(--ink-2); }
.hair .opt { justify-items: center; text-align: center; padding: 10px 6px; }
.hair svg { width: 46px; height: 52px; }
.addon { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 11px 12px; cursor: pointer; }
.addon input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--olive); }
.addon .t { font-weight: 600; font-size: 14px; }
.addon .s { font-size: 12.5px; color: var(--ink-2); }
.addon .p { font-weight: 600; white-space: nowrap; text-align: right; font-size: 13.5px; }
.person { background: transparent; border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 10px; }
.person > b { font-size: 13px; color: var(--ink-2); font-weight: 600; }

.dates { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.date { flex: 0 0 auto; width: 58px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 7px 0; text-align: center; display: grid; }
.date .w, .date .m { font-size: 11px; color: var(--ink-2); }
.date .d { font-family: var(--f-display); font-size: 21px; line-height: 1.1; }
.date[aria-pressed="true"] { background: var(--olive); color: var(--olive-ink); border-color: var(--olive); }
.date[aria-pressed="true"] .w, .date[aria-pressed="true"] .m { color: var(--olive-ink); }
.date:disabled { opacity: .4; }
.slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; }
.slot { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.slot:disabled { background: transparent; border-style: dashed; color: var(--mute); text-decoration: line-through; font-weight: 400; }
.slot[aria-pressed="true"] { background: var(--olive); color: var(--olive-ink); border-color: var(--olive); }

.ticket { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 6px; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; }
.kv span:first-child { color: var(--ink-2); }
.kv span:last-child { text-align: right; font-weight: 500; }
.kv.total { border-top: 1px solid var(--line); padding-top: 6px; font-size: 15px; }
.kv.total span:last-child { font-weight: 700; }

.status { background: var(--ink); color: var(--paper); border-radius: 18px; padding: 16px; display: grid; gap: 10px; }
.status .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
.status h3 { font-family: var(--f-display); font-size: 24px; line-height: 1.2; }
:lang(th) .status h3 { font-family: var(--f-thai); font-size: 20px; }
.status p { margin: 0; font-size: 13.5px; opacity: .9; }
.status .btn { background: var(--paper); color: var(--ink); }
.status .btn.ghost { background: transparent; color: var(--paper); border-color: rgb(255 255 255 / .35); }
.bar { height: 8px; background: rgb(255 255 255 / .2); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--sand); }
.big { font-family: var(--f-display); font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.upcard { background: var(--paper); color: var(--ink); border-radius: 14px; padding: 12px; display: grid; gap: 8px; }
.upcard .btn { background: var(--ink); color: var(--paper); }
.upcard .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.stars { display: flex; gap: 6px; }
.stars button { background: none; border: 0; font-size: 30px; line-height: 1; padding: 0; color: var(--mute); }
.stars button[aria-pressed="true"] { color: #d9a441; }
.tips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tips button { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 0; font-weight: 600; }
.tips button[aria-pressed="true"] { background: var(--olive); color: var(--olive-ink); border-color: var(--olive); }

.wallet { display: grid; gap: 8px; }
.wrow { display: flex; justify-content: space-between; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 11px 12px; }
.wrow .t { font-weight: 600; font-size: 14px; }
.wrow .s { font-size: 12px; color: var(--ink-2); }
.wrow .cnt { font-family: var(--f-display); font-size: 26px; line-height: 1; }
.empty { border: 1px dashed var(--line); border-radius: 14px; padding: 14px; color: var(--ink-2); font-size: 13px; text-align: center; }
label.f { display: grid; gap: 4px; font-size: 12.5px; color: var(--ink-2); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--olive); flex: 0 0 auto; }
.err { color: var(--warn); font-size: 13px; margin: 0; }

.beam { position: absolute; inset: 0; background: rgb(20 12 8 / .55); display: flex; align-items: flex-end; z-index: 9; }
.beam .panel { width: 100%; background: #ffffff; color: #1d1d1f; border-radius: 22px 22px 0 0; padding: 18px 18px 22px; display: grid; gap: 12px; font-family: system-ui, sans-serif; }
.beam .note { font-size: 11.5px; color: #6b6b70; }
.beam .amt { font-size: 30px; font-weight: 700; }
.beam label { display: flex; gap: 10px; align-items: center; border: 1px solid #dcdce0; border-radius: 12px; padding: 11px 12px; font-size: 14px; color: #1d1d1f; }
.beam label:has(input:checked) { border-color: #1d1d1f; }
.beam .pay { background: #1d1d1f; color: #fff; border: 0; border-radius: 12px; padding: 13px; font-weight: 600; font-size: 15px; }
.toast { position: absolute; left: 14px; right: 14px; bottom: 18px; background: var(--ink); color: var(--paper); border-radius: 14px; padding: 10px 14px; font-size: 13px; z-index: 12; box-shadow: 0 8px 24px rgb(0 0 0 / .2); }
.foot { font-size: 12px; color: var(--ink-2); }

.devsw { justify-self: start; }
.devsw button { padding: 5px 12px; font-size: 13px; }
.tablet { width: 860px; max-width: 100%; height: min(640px, calc(100dvh - 48px)); min-height: 520px; flex: 0 1 auto; background: var(--paper); border-radius: 28px; border: 10px solid var(--ink); position: relative; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgb(40 20 10 / .18); }
.tbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.tname { flex: 1; font-family: var(--f-display); font-size: 18px; }
.tbody { flex: 1; overflow-y: auto; padding: 22px 26px 28px; }
.khome { display: grid; gap: 16px; justify-items: center; text-align: center; max-width: 620px; margin: 0 auto; padding-top: 10px; }
.khome h1 { font-family: var(--f-display); font-size: 40px; }
:lang(th) .khome h1 { font-family: var(--f-thai); font-weight: 600; font-size: 32px; }
.khome .eyebrow, .kcol .eyebrow, .kleft .eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.kbtns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; width: 100%; }
.kbig { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 26px 18px; display: grid; gap: 6px; text-align: center; width: 100%; }
.kbig b { font-size: 19px; }
.kbig span { font-size: 13.5px; color: var(--ink-2); }
.kbig:not(:disabled):hover { border-color: var(--olive); }
.kbig.small { padding: 14px; }
.kbig:disabled { opacity: .5; }
.kbtns .kbig:first-child { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.kbtns .kbig:first-child span { color: var(--paper); opacity: .8; }
.kcol { max-width: 440px; margin: 0 auto; display: grid; gap: 14px; }
.kcol h2, .kleft h2 { font-family: var(--f-display); font-size: 24px; }
:lang(th) .kcol h2, :lang(th) .kleft h2, :lang(th) .khome h2 { font-family: var(--f-thai); font-weight: 600; font-size: 21px; }
.kdisp { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; text-align: center; font-size: 28px; letter-spacing: .08em; font-variant-numeric: tabular-nums; min-height: 64px; }
.keys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.key { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 0; font-size: 22px; font-weight: 600; }
.key.ok { background: var(--olive); color: var(--olive-ink); border-color: var(--olive); font-size: 17px; }
.ksplit { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 22px; }
.kleft, .kright { display: grid; gap: 12px; align-content: start; min-width: 0; }
.kb { padding-block: 14px; font-size: 16px; }
.qno { font-family: var(--f-display); font-size: 96px; line-height: 1; color: var(--olive); }
.qno.small { font-size: 34px; }
.bhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-bottom: 12px; }
.bhead h2 { font-family: var(--f-thai); font-weight: 600; font-size: 20px; }
.bsum { display: flex; gap: 8px; flex-wrap: wrap; padding-bottom: 12px; }
.pill { border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 600; }
.pill.free, .bed.free .bn::before { background: var(--sand); }
.pill.busy { background: var(--olive); color: var(--olive-ink); }
.pill.over { background: var(--warn); color: var(--paper); }
.beds { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.bed { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; background: var(--card); display: grid; gap: 4px; min-width: 0; }
.bed .bn { font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--ink-2); }
.bed .bs { font-size: 13px; line-height: 1.35; }
.bed .bs span { color: var(--ink-2); font-size: 12px; }
.bed .bs .badge { color: var(--olive-ink); font-size: 10.5px; }
.bed.busy { border-color: var(--olive); box-shadow: inset 4px 0 0 var(--olive); }
.bed.over { border-color: var(--warn); box-shadow: inset 4px 0 0 var(--warn); }
.bed.over .bs { color: var(--warn); }
.bed.free .bs { color: var(--ink-2); }
.bcols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding-top: 16px; }
.bcols h3 { font-size: 15px; padding-bottom: 6px; }
.bcols .wrow { margin-bottom: 6px; }

      '<div class="row2">' + (k.match.tickets ? '<button class="btn small" data-kmember="tickets">' + t('ใช้ตั๋วที่มี', 'Use my ticket') + '</button>' : '') + '<button class="btn small' + (k.match.tickets ? ' ghost' : '') + '" data-kmember="buy">' + t('ซื้อใหม่ เข้าบัญชีเดิม', 'Buy, add to my account') + '</button><button class="btn small ghost" data-kmember="edit">' + t('ไม่ใช่ฉัน แก้เบอร์', 'Not me, edit') + '</button></div></div>';

    var ready = (!p.hair || pe.hair) && (!(pe.alerts || []).length || pe.healthOk);
    h += '<button class="btn block kb" data-kpay' + (ready ? '' : ' disabled') + '>' + (total ? t('จ่าย ', 'Pay ') + baht(total) + t(' และรับคิว', ' & get queue number') : t('รับคิว', 'Get queue number')) + '</button>' + (ready ? '' : '<span class="hint">' + t('เลือกความยาวผมก่อน', 'Choose hair length first') + '</span>') + '</div></div>';
    return h;
  }
  /* keep typed name/phone/email when the screen redraws */
  function saveForm() { var k = S.k; if ($('k-name')) { k.name = $('k-name').value.trim(); k.phoneRaw = $('k-phone').value.trim(); k.email = $('k-email').value.trim(); k.consent = $('k-consent').checked; } }
  function qrSvg(text) {
    try { var q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } catch (e) { return '<span class="hint">' + esc(text) + '</span>'; }
  }
  function render() {
    $('app').lang = S.lang;
    $('tlang').innerHTML = '<button data-lang="th" aria-pressed="' + (S.lang === 'th') + '">ไทย</button><button data-lang="en" aria-pressed="' + (S.lang === 'en') + '">EN</button>';
    if (!S.cfg) { $('tbody').innerHTML = '<div class="khome"><div class="spin"></div></div>'; return; }
    $('tback').style.visibility = S.k.screen === 'home' ? 'hidden' : 'visible';
    $('tname').textContent = 'Lana · ' + nm(branch(S.branch));
    $('tbody').innerHTML = body();
  }

  /* ---------- payment ---------- */
  function goPay(r, label, then) {
    if (demo) {
      $('beampanel').innerHTML = '<span class="note">' + t('หน้าจ่ายเงินจำลอง ระบบจริงเปิดหน้าของ Beam (บัตร · พร้อมเพย์)', 'Pretend checkout. The real tablet opens Beam (card · PromptPay).') + '</span><div><div class="note">' + esc(label) + '</div><div class="amt">' + baht(r.amount) + '</div></div>' +
        '<label><input type="radio" name="pm" checked> ' + t('บัตรเครดิต / เดบิต', 'Credit / debit card') + '</label><label><input type="radio" name="pm"> PromptPay</label><button class="pay" id="paygo">' + t('จ่าย ', 'Pay ') + baht(r.amount) + '</button><button class="linkbtn" id="paycancel" style="justify-self:center">' + t('ยกเลิก', 'Cancel') + '</button>';
      $('beam').hidden = false; $('paycancel').onclick = function () { $('beam').hidden = true; };
      $('paygo').onclick = function () { DS.db.beam['B' + r.orderId] = 'PAID'; $('beam').hidden = true; waitOrder(r.orderId, label); };
      return;
    }
    try { sessionStorage.setItem('lana-k-label', label); } catch (e) {}
    location.href = r.url;
  }
  function waitOrder(id, label) {
    go('wait'); var tries = 0;
    (function poll() {
      api('order', { id: id }).then(function (o) {
        if (o.status === 'paid') { if (o.kind === 'checkout') return go('thanks'); return go('queue', { q: o.q, vkey: o.vkey, label: label }); }
        if (o.status !== 'pending' || ++tries > 40) { toast(t('ยังไม่ได้รับเงิน ลองอีกครั้ง หรือเรียกพนักงาน', 'Payment not confirmed. Try again or ask our staff.')); return go('home'); }
        setTimeout(poll, 3000);
      }).catch(function (e) { toast(errT(e)); go('home'); });
    })();
  }
  function returnUrl() { return demo ? '' : location.origin + location.pathname; }

  /* ---------- actions ---------- */
  function keyIn(key) {
    var k = S.k, max = k.intl ? 15 : 10;
    if (key === 'DEL') k.val = (k.val || '').slice(0, -1);
    else if (key !== 'OK') { if ((k.val || '').length < max) k.val = (k.val || '') + key; }
    else {
      var e164 = normPhone(k.val, k.intl);
      if (!phoneOK(e164)) { k.err = t('ใส่เบอร์ให้ครบ', 'Enter the full number'); return render(); }
      return find_({ phone: e164, intl: k.intl });
    }
    k.err = ''; render();
  }
  function find_(who) {
    api('kFind', who).then(function (r) {
      /* booked for now at this branch: check in straight away, no extra tap */
      var bk = r.booking, c = r.check;
      if (r.member && bk && bk.status === 'booked' && c && !c.late && !c.other && !c.early)
        return api('kCheckin', { id: bk.id }).then(function (x) {
          if (x.result === 'checkedin') return go('queue', { q: x.q, vkey: x.vkey, label: t('สวัสดีคุณ ', 'Hello ') + r.member.name + ' · ' + nm(prog(bk.people[0].prog)) + (x.late ? ' · ' + t('มาสาย บริการจบตามเวลาเดิม', 'late, ends at the original time') : '') });
          go('found', { found: r, who: who });
        });
      if (r.member) return go('found', { found: r, who: who });
      go('walkin', { phoneRaw: who.phone || '', email: who.email || '', intl: who.intl });
    }).catch(function (e) { toast(errT(e)); });
  }
  function kpay() {
    var k = S.k, p = prog(k.prog), req = { prog: k.prog, person: k.person, pack: k.useT ? '1' : (k.pack || '1'), returnUrl: returnUrl() };
    if (k.useT) Object.assign(req, k.who, { useTicket: true });
    else if (k.memberChoice) Object.assign(req, k.who, { memberChoice: 'buy' });
    else {
      k.name = $('k-name').value.trim(); k.phoneRaw = $('k-phone').value.trim(); k.email = $('k-email').value.trim(); k.consent = $('k-consent').checked;
      if (!k.name) { k.err = errT('NEED_NAME'); return render(); }
      if ((k.pack || '1') !== '1' && !k.phoneRaw && !k.email) { k.err = t('ซื้อคอร์สต้องใส่เบอร์หรืออีเมล เพื่อเก็บตั๋วที่เหลือ', 'Courses need a phone or email to keep the remaining sessions'); return render(); }
      Object.assign(req, { name: k.name, phone: k.phoneRaw, email: k.email, consent: k.consent, memberChoice: k.choice || undefined });
    }
    api('kStart', req).then(function (r) {
      if (r.match) { k.match = r.match; k.who = { phone: k.phoneRaw, email: k.email }; k.err = ''; return render(); }
      if (r.url) return goPay(r, nm(p));
      go('queue', { q: r.q, vkey: r.vkey, label: nm(p) + ' · ' + t('เริ่ม ', 'starts ') + hm(r.start) });
    }).catch(function (e) { k.err = errT(e); render(); });
  }
  /* demo only: try a photo from this device on a menu card (stays in this page, nothing is uploaded) */
  var picIn = document.createElement('input'); picIn.type = 'file'; picIn.accept = 'image/*'; picIn.hidden = true; document.body.appendChild(picIn);
  picIn.onchange = function () { var f = picIn.files && picIn.files[0], id = picIn.dataset.id; if (!f) return; var r = new FileReader();
    r.onload = function () { S.cfg.programs.forEach(function (p) { if (p.id === id) p.img = r.result; }); picIn.value = ''; render(); }; r.readAsDataURL(f); };
  document.addEventListener('click', function (e) {
    var pc = e.target.closest('[data-kpic]'); if (pc && demo) { e.preventDefault(); e.stopPropagation(); picIn.dataset.id = pc.dataset.kpic; picIn.click(); return; }
    var el = e.target.closest('button'); if (!el) return;
    var d = el.dataset, k = S.k; idle();
    if (d.lang) { S.lang = d.lang; return render(); }
    if (d.setup !== undefined) {
      S.key = $('s-key').value.trim(); S.branch = $('s-br').value;
      return api('kOut').then(function () { try { localStorage.setItem('lana-kiosk-key', S.key); localStorage.setItem('lana-kiosk-branch', S.branch); } catch (x) {} go('home'); }).catch(function (x) { k.err = errT(x); render(); });
    }
    if (d.k) return go(d.k, d.k === 'walkin' ? {} : {});
    if (d.key) return keyIn(d.key);
    if (d.kintl) { k.intl = d.kintl === '1'; k.val = ''; k.err = ''; return render(); }
    if (d.kmode) { k.mode = d.kmode; k.err = ''; k.val = ''; return render(); }
    if (d.kemail !== undefined) { var em = $('k-em').value.trim(); k.email = em; if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { k.err = t('อีเมลไม่ถูกต้อง', 'Please check the email'); return render(); } return find_({ email: em }); }
    if (d.kci || d.kciMove) {
      return api('kCheckin', { id: d.kci || d.kciMove, move: !!d.kciMove }).then(function (r) {
        if (r.result === 'checkedin') return go('queue', { q: r.q, vkey: r.vkey, label: nm(prog(r.booking.people[0].prog)) + (r.late ? ' · ' + t('มาสาย บริการจบตามเวลาเดิม', 'late, ends at the original time') : '') });
        if (r.result === 'noshow') { toast(t('ตั๋วกลับเข้ากระเป๋าแล้ว ใช้ตั๋วเริ่มตอนนี้ได้', 'Ticket returned, you can use it now')); return find_(k.who); }
        toast(r.result === 'nofree' ? t('ตอนนี้ไม่มีที่ว่าง', 'No free seat right now') : r.result); return find_(k.who);
      }).catch(function (x) { toast(errT(x)); });
    }
    if (d.kuse !== undefined) return go('walkin', { useT: true, tickets: k.found.tickets, who: k.who, tier: k.found.member.tier });
    if (d.kbuy !== undefined) return go('walkin', k.who && k.found ? { memberChoice: 'buy', who: k.who, tier: k.found.member.tier } : {});
    if (d.kprog) { k.prog = d.kprog; k.person = newPerson(); render(); var tb = $('tbody'); if (tb) tb.scrollTop = 0; return; }
    if (d.kvar) { saveForm(); k.prog = d.kvar; if (k.person) k.person.addons = k.person.addons.filter(function (id) { var a = find(S.cfg.addons, id); return a && a.for.indexOf(d.kvar) >= 0; }); if (!(prog(d.kvar) || {}).pack3 && k.pack === '3') k.pack = '1'; return render(); }
    if (d.kmenu !== undefined) { k.prog = ''; k.person = null; render(); var tb2 = $('tbody'); if (tb2) tb2.scrollTop = 0; return; }
    if (d.kpack) { saveForm(); k.pack = d.kpack; return render(); }
    if (d.khair) { saveForm(); k.person.hair = d.khair; return render(); }
    if (d.kstyle) { saveForm(); k.person.style = d.kstyle; return render(); }
    if (d.kalert) { saveForm(); var pa = k.person; pa.alerts = pa.alerts || []; var ix = pa.alerts.indexOf(d.kalert); if (ix >= 0) pa.alerts.splice(ix, 1); else pa.alerts.push(d.kalert); return render(); }
    if (d.kpref) { saveForm(); var pp = d.kpref.split('|'); k.person[pp[0]] = pp[0] === 'quiet' ? pp[1] === '1' : pp[1]; return render(); }
    if (d.kmember) {
      if (d.kmember === 'edit') { k.match = null; k.phoneRaw = ''; k.email = ''; return render(); }
      if (d.kmember === 'tickets') return api('kFind', k.who).then(function (r) { go('walkin', { useT: true, tickets: r.tickets, who: k.who }); });
      k.memberChoice = 'buy'; k.match = null; return kpay();
    }
    if (d.kpay !== undefined) return kpay();
    if (d.kout) return api('kOut').then(function (r) { var b = find(r.list, d.kout); go('checkout', { view: b.view }); });
    if (d.tip) { S.co[k.view.id].tip = +d.tip; return render(); }
    if (d.star) { var c = $('cmt'); if (c) S.co[k.view.id].cmt = c.value; S.co[k.view.id].stars = +d.star; return render(); }
    if (d.kcheckout !== undefined) {
      var co = S.co[k.view.id], cm = $('cmt'); if (cm) co.cmt = cm.value;
      return api('checkout', { id: k.view.id, tip: co.tip, stars: co.stars, cmt: co.cmt, returnUrl: returnUrl() }).then(function (r) { if (r.url) return goPay(r, t('ยอดค้างและทิป', 'Balance and tip')); go('thanks'); }).catch(function (x) { toast(errT(x)); });
    }
  });
  document.addEventListener('change', function (e) {
    var el = e.target, k = S.k;
    if (el.dataset.kaddon) { saveForm(); var i = k.person.addons.indexOf(el.dataset.kaddon); if (el.checked && i < 0) k.person.addons.push(el.dataset.kaddon); if (!el.checked && i >= 0) k.person.addons.splice(i, 1); render(); }
    if (el.id === 'k-phone' || el.id === 'k-email') { k.match = null; k.choice = null; }
    if (el.id === 'k-health') { saveForm(); k.person.healthOk = el.checked; return render(); }
  });
  $('tback').onclick = function () { go('home'); };
  /* back to the welcome screen after 90 s without a touch */
  var idleT; function idle() { clearTimeout(idleT); idleT = setTimeout(function () { if (S.k.screen !== 'wait' && S.k.screen !== 'setup') { S.lang = 'th'; go('home'); } }, 90000); }
  document.addEventListener('pointerdown', idle);

  api('config').then(function (cfg) {
    S.cfg = cfg;
    if (!S.key || !branch(S.branch)) return go('setup');
    var o = Q.get('order');
    if (o) { history.replaceState(null, '', location.pathname); var label = ''; try { label = sessionStorage.getItem('lana-k-label') || ''; } catch (e) {} return waitOrder(o, label); }
    go('home');
  }).catch(function (e) { $('tbody').innerHTML = '<div class="khome"><p class="err">' + esc(errT(e)) + '</p><button class="btn" onclick="location.reload()">' + t('ลองใหม่', 'Try again') + '</button></div>'; });
  window.__KIOSK = { state: function () { return S; }, go: go };
})();
</script>
